name: Deploy

# GitHub Actions is the only path to Maincloud -- never a local `spacetime
# publish` (docs/architecture.md). Both jobs below land and run on every
# push to master, and fail loudly if their secret or environment is not
# yet provisioned; neither is ever silently skipped for that reason. See
# server/README.md's "Maincloud provisioning" section for the one-time
# manual setup this workflow depends on.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  publish-module:
    name: publish-module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - run: bash scripts/ci/install-spacetimedb-cli.sh "$RUNNER_TEMP/spacetimedb" >> "$GITHUB_PATH"
      - name: publish to Maincloud
        env:
          SPACETIMEDB_TOKEN: ${{ secrets.SPACETIMEDB_TOKEN }}
        run: |
          if [ -z "${SPACETIMEDB_TOKEN:-}" ]; then
            echo "::error::SPACETIMEDB_TOKEN is not set -- provision it per server/README.md's Maincloud provisioning section" >&2
            exit 1
          fi
          spacetime login --token "$SPACETIMEDB_TOKEN" --no-browser
          # --yes is the only non-interactive flag this ever carries: no
          # --delete-data, now or ever -- a destructive publish belongs to
          # nobody's CI.
          spacetime publish --no-config --server maincloud --module-path server --yes browser-city

  deploy-client:
    name: deploy-client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: build with production connection config
        env:
          VITE_SPACETIME_URI: wss://maincloud.spacetimedb.com
          VITE_SPACETIME_DB: browser-city
        run: npm run build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: client/dist
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
