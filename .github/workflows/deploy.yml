name: deploy

# Publishes the module to Maincloud and deploys the client to GitHub
# Pages -- the one path from a merge on master to a running game. Split
# out of #49/#266 (never provisioned there, would have been red on every
# push, no post-deploy verification); this workflow only lands once the
# `SPACETIME_MAINCLOUD_TOKEN` secret, the `vars.BACKUP_DATABASE`/
# `vars.MAINCLOUD_OWNER_IDENTITY` variables and the `github-pages`
# environment are already provisioned -- see server/README.md.
#
# Trigger: `workflow_run` of `ci` on `master`, only when it actually
# succeeded -- this workflow deploys `ci`'s own head commit, never
# whatever master happens to be at by the time this runs. `workflow_dispatch`
# exists to retry a deploy or to smoke-test it after provisioning, without
# an empty commit to master; a dispatch still refuses to run against a
# commit whose own `ci` check run did not succeed (the `resolve` job,
# below) -- it retries a deploy that already passed CI, it does not skip
# CI.
#
# One credential, one owner identity (Quentin's direction): this reuses
# `backup.yml`'s own `SPACETIME_MAINCLOUD_TOKEN` secret and
# `vars.BACKUP_DATABASE` variable rather than adding a second copy of
# either -- a backup restorable only by an identity nobody holds is not a
# backup, so the identity that publishes here must be the same one that
# owns the live database backup.yml exports. `vars.MAINCLOUD_OWNER_IDENTITY`
# is the mechanical proof of that: every job that logs in compares the
# identity `spacetime login show` actually reports against it and refuses
# to continue if they differ, rather than trusting `--token`/`--no-config`
# silently did the right thing.
#
# Two publishes must never overlap, and a publish must never be killed
# halfway (a partial module publish or a partial Pages deploy is worse
# than a slow one) -- `concurrency` below queues a second run rather than
# cancelling the first.
#
# scripts/ci/check-deploy-workflow.sh is this file's own structural guard
# (run in `ci.yml`'s `scripts-tests` job on every change under
# `.github/workflows/**`): no destructive publish flag anywhere below, and
# `publish-module` always `needs:` the `backup` job.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to the tip of master) -- must carry a green 'ci' check run"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # This repo is `Abaudat/browser-city` with no custom domain, so Pages
  # serves the client from this path, never the domain root.
  BASE_PATH: /browser-city/
  PAGES_URL: https://abaudat.github.io/browser-city/
  # server/AGENTS.md's server-alias table: `maincloud` resolves to
  # `https://maincloud.spacetimedb.com`; the client dials the same host
  # over `wss://`. Public information, not a secret -- unlike the
  # database name (`vars.BACKUP_DATABASE`), which is a repo variable so
  # it stays the single source both this workflow and backup.yml read.
  MAINCLOUD_WS_URI: wss://maincloud.spacetimedb.com

jobs:
  # Resolves the exact commit to deploy, and is the one place a dispatch
  # is refused for not having passed CI -- every other job trusts this
  # job's output rather than re-deriving it.
  resolve:
    name: resolve
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    permissions:
      contents: read
      checks: read
    steps:
      - name: resolve the commit to deploy
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SHA="$WORKFLOW_RUN_SHA"
          else
            SHA="${DISPATCH_SHA:-$DEFAULT_SHA}"
            # A dispatch retries a deploy that already passed CI; it does
            # not skip CI. Refuse outright rather than publish an
            # unvetted commit.
            CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" --jq '[.check_runs[] | select(.name == "ci")] | sort_by(.started_at) | last | .conclusion // "missing"')"
            if [ "$CONCLUSION" != "success" ]; then
              echo "::error::refusing to deploy $SHA -- its 'ci' check run did not succeed (conclusion: '$CONCLUSION')" >&2
              exit 1
            fi
          fi
          echo "resolve: deploying $SHA" >&2
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # Whether client-affecting paths changed in this deploy's own commit --
  # `deploy-client` skips on a module-only change (`smoke` still runs
  # against the already-deployed client, below: a module can break a
  # client that is already live).
  changes:
    name: changes
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 2
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: HEAD^
          filters: |
            client:
              - 'client/**'
              - 'ModernTileset/moderninteriors-win/2_Characters/Character_Generator/**'
              - 'ModernTileset/modernexteriors-win/Modern_Exteriors_16x16/Character_Generator_Addons_16x16/**'

  # NFR39: the world is backed up before every publish. The one exception
  # is the very first deploy, when the database does not exist yet --
  # detected with an explicit `spacetime describe` probe, never `|| true`
  # on the export itself. Also where the deploy identity is verified
  # (Quentin's direction): every later job that logs in repeats this
  # check rather than trusting an earlier job's login carried over --
  # each job is a fresh runner.
  backup:
    name: backup
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
      - run: bash scripts/ci/install-spacetimedb-cli.sh "$RUNNER_TEMP/spacetimedb" >> "$GITHUB_PATH"
      # export-world.sh builds server/tools/world_backup the first time it
      # needs it -- same toolchain backup.yml's own export job installs.
      - run: cd server && rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server

      - name: check required secrets/variables are present (a missing one is a failure, never a skip)
        env:
          SPACETIME_MAINCLOUD_TOKEN: ${{ secrets.SPACETIME_MAINCLOUD_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_DATABASE: ${{ vars.BACKUP_DATABASE }}
          MAINCLOUD_OWNER_IDENTITY: ${{ vars.MAINCLOUD_OWNER_IDENTITY }}
        run: |
          missing=""
          [ -n "$SPACETIME_MAINCLOUD_TOKEN" ] || missing="$missing SPACETIME_MAINCLOUD_TOKEN"
          [ -n "$BACKUP_PASSPHRASE" ] || missing="$missing BACKUP_PASSPHRASE"
          [ -n "$BACKUP_DATABASE" ] || missing="$missing vars.BACKUP_DATABASE"
          [ -n "$MAINCLOUD_OWNER_IDENTITY" ] || missing="$missing vars.MAINCLOUD_OWNER_IDENTITY"
          if [ -n "$missing" ]; then
            echo "::error::deploy.yml (backup): missing required secret(s)/variable(s):$missing -- see server/README.md's Maincloud provisioning section" >&2
            exit 1
          fi

      - name: log into Maincloud with the deploy service identity
        env:
          SPACETIME_MAINCLOUD_TOKEN: ${{ secrets.SPACETIME_MAINCLOUD_TOKEN }}
        run: spacetime login --token "$SPACETIME_MAINCLOUD_TOKEN" --no-browser

      - name: prove the credential actually carried through -- the logged-in identity must own the live database
        env:
          MAINCLOUD_OWNER_IDENTITY: ${{ vars.MAINCLOUD_OWNER_IDENTITY }}
        run: |
          ACTUAL="$(spacetime login show | sed -n 's/^You are logged in as //p')"
          if [ "$ACTUAL" != "$MAINCLOUD_OWNER_IDENTITY" ]; then
            echo "::error::logged in as '$ACTUAL', expected the owner identity '$MAINCLOUD_OWNER_IDENTITY' (vars.MAINCLOUD_OWNER_IDENTITY) -- refusing to continue under the wrong identity" >&2
            exit 1
          fi
          echo "deploy: logged in as the expected owner identity ($ACTUAL)" >&2

      - name: does the live database already exist yet? (NFR39's one allowed exception -- the very first deploy)
        id: exists
        env:
          BACKUP_DATABASE: ${{ vars.BACKUP_DATABASE }}
        run: |
          if spacetime describe "$BACKUP_DATABASE" --server maincloud --no-config -y --json >/dev/null 2>"$RUNNER_TEMP/describe.err"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::'$BACKUP_DATABASE' does not exist on Maincloud yet -- this is the first deploy, so there is nothing to back up" >&2
            cat "$RUNNER_TEMP/describe.err" >&2
          fi

      - name: export the live database before publishing (NFR39)
        if: steps.exists.outputs.exists == 'true'
        env:
          BACKUP_DATABASE: ${{ vars.BACKUP_DATABASE }}
        run: bash scripts/ops/export-world.sh "$BACKUP_DATABASE" "$RUNNER_TEMP/export" --server maincloud

      - name: encrypt the export before it ever touches an artifact
        if: steps.exists.outputs.exists == 'true'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/export.tar.gz" export
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-fd 0 \
            --output "$RUNNER_TEMP/export.tar.gz.gpg" "$RUNNER_TEMP/export.tar.gz"
          rm -f "$RUNNER_TEMP/export.tar.gz"
          rm -rf "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.exists.outputs.exists == 'true'
        with:
          name: pre-deploy-export-${{ github.run_id }}
          path: ${{ runner.temp }}/export.tar.gz.gpg
          retention-days: 90

  # Publishes the module to Maincloud and lands any newly-added
  # sim::codes rows -- server/README.md names this job as `reseed_codes`'s
  # automated caller.
  publish-module:
    name: publish-module
    needs: [resolve, backup]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
      - run: bash scripts/ci/install-spacetimedb-cli.sh "$RUNNER_TEMP/spacetimedb" >> "$GITHUB_PATH"
      - run: cd server && rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server

      - name: check required secrets/variables are present (a missing one is a failure, never a skip)
        env:
          SPACETIME_MAINCLOUD_TOKEN: ${{ secrets.SPACETIME_MAINCLOUD_TOKEN }}
          BACKUP_DATABASE: ${{ vars.BACKUP_DATABASE }}
          MAINCLOUD_OWNER_IDENTITY: ${{ vars.MAINCLOUD_OWNER_IDENTITY }}
        run: |
          missing=""
          [ -n "$SPACETIME_MAINCLOUD_TOKEN" ] || missing="$missing SPACETIME_MAINCLOUD_TOKEN"
          [ -n "$BACKUP_DATABASE" ] || missing="$missing vars.BACKUP_DATABASE"
          [ -n "$MAINCLOUD_OWNER_IDENTITY" ] || missing="$missing vars.MAINCLOUD_OWNER_IDENTITY"
          if [ -n "$missing" ]; then
            echo "::error::deploy.yml (publish-module): missing required secret(s)/variable(s):$missing -- see server/README.md's Maincloud provisioning section" >&2
            exit 1
          fi

      - name: log into Maincloud with the deploy service identity
        env:
          SPACETIME_MAINCLOUD_TOKEN: ${{ secrets.SPACETIME_MAINCLOUD_TOKEN }}
        run: spacetime login --token "$SPACETIME_MAINCLOUD_TOKEN" --no-browser

      - name: prove the credential actually carried through -- the logged-in identity must own the live database
        env:
          MAINCLOUD_OWNER_IDENTITY: ${{ vars.MAINCLOUD_OWNER_IDENTITY }}
        run: |
          ACTUAL="$(spacetime login show | sed -n 's/^You are logged in as //p')"
          if [ "$ACTUAL" != "$MAINCLOUD_OWNER_IDENTITY" ]; then
            echo "::error::logged in as '$ACTUAL', expected the owner identity '$MAINCLOUD_OWNER_IDENTITY' (vars.MAINCLOUD_OWNER_IDENTITY) -- refusing to publish under the wrong identity" >&2
            exit 1
          fi
          echo "deploy: logged in as the expected owner identity ($ACTUAL)" >&2

      - name: publish the module to Maincloud
        env:
          BACKUP_DATABASE: ${{ vars.BACKUP_DATABASE }}
        run: spacetime publish --server maincloud --no-config -y "$BACKUP_DATABASE" --module-path server

      - name: land any newly-added sim::codes rows (NFR36/NFR38) -- server/README.md's own manual step, now automated here
        env:
          BACKUP_DATABASE: ${{ vars.BACKUP_DATABASE }}
        run: spacetime call --server maincloud --no-config -y "$BACKUP_DATABASE" reseed_codes

  # Builds the production client and deploys it to GitHub Pages. Skips on
  # a module-only change (`needs.changes.outputs.client == 'false'`); the
  # `smoke` job below still runs in that case, against the client that is
  # already deployed.
  deploy-client:
    name: deploy-client
    needs: [resolve, changes, publish-module]
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Full checkout, never sparse or client/-only (docs/architecture.md):
      # the test street reads ModernTileset/** straight off the repo root
      # at runtime.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: production build -- the real Pages base and the real Maincloud coordinates
        working-directory: client
        env:
          VITE_SPACETIME_URI: ${{ env.MAINCLOUD_WS_URI }}
          VITE_SPACETIME_DB: ${{ vars.BACKUP_DATABASE }}
        run: npx vite build --base="$BASE_PATH"

      - name: stamp the build with the exact commit deployed -- the smoke job's own propagation check
        working-directory: client
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: sed -i "s#</head>#  <meta name=\"bc-build\" content=\"$SHA\" />\n  </head>#" dist/index.html

      - name: base path and production URI both check out -- fails before Pages ever serves it
        run: bash scripts/ci/check-pages-bundle.sh client/dist "$BASE_PATH"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: client/dist
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # A publish or a client bundle that does not actually work must never be
  # a green workflow (the issue's own framing). Runs whenever
  # `publish-module` succeeded, whether or not `deploy-client` ran: a
  # module-only change can break a client that is already deployed.
  smoke:
    name: smoke
    needs: [resolve, changes, publish-module, deploy-client]
    if: |
      always() &&
      needs.publish-module.result == 'success' &&
      (needs.deploy-client.result == 'success' || needs.deploy-client.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - working-directory: client
        run: npx playwright install --with-deps chromium

      - name: check required secrets/variables are present (a missing one is a failure, never a skip)
        env:
          DEPLOY_SMOKE_TOKEN: ${{ secrets.DEPLOY_SMOKE_TOKEN }}
          BACKUP_DATABASE: ${{ vars.BACKUP_DATABASE }}
        run: |
          missing=""
          [ -n "$DEPLOY_SMOKE_TOKEN" ] || missing="$missing DEPLOY_SMOKE_TOKEN"
          [ -n "$BACKUP_DATABASE" ] || missing="$missing vars.BACKUP_DATABASE"
          if [ -n "$missing" ]; then
            echo "::error::deploy.yml (smoke): missing required secret(s)/variable(s):$missing -- see server/README.md's Maincloud provisioning section" >&2
            exit 1
          fi

      # Pages propagation can lag: this job would otherwise pass against
      # the *previous* deploy. Skipped when deploy-client itself did not
      # run (a module-only change) -- the live page did not change, so
      # there is no new SHA to wait for.
      - name: wait for Pages to actually serve this exact commit
        if: needs.deploy-client.result == 'success'
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          DEADLINE=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            BODY="$(curl -sf "$PAGES_URL" || true)"
            if printf '%s' "$BODY" | grep -qF "bc-build\" content=\"$SHA\""; then
              echo "deploy: $PAGES_URL now serves $SHA" >&2
              exit 0
            fi
            sleep 5
          done
          echo "::error::$PAGES_URL did not serve commit $SHA within 300s -- Pages propagation failed, or the deploy is broken" >&2
          exit 1

      # A real Playwright spec, not an HTTP 200 check (the issue's own
      # framing): asserts no failed request, no console error, the
      # WebSocket dials the configured Maincloud URI and database, the
      # initial subscription applies, and the player-controllable mark
      # fires. `ci.yml`'s `e2e` job runs the identical spec against a
      # production-base build under /browser-city/, backed by a
      # disposable local SpacetimeDB, so a broken spec is caught before
      # merge. One fixed identity token (DEPLOY_SMOKE_TOKEN), reused every
      # run via the ?bc-token= override `net/connection.ts` reads --
      # never a fresh identity, which would slowly pollute the production
      # world (NFR39 live-database hygiene).
      - name: post-deploy smoke check against the live URL
        working-directory: client
        env:
          BC_DEPLOY_URL: ${{ env.PAGES_URL }}?bc-token=${{ secrets.DEPLOY_SMOKE_TOKEN }}
          BC_DEPLOY_EXPECT_WS_ORIGIN: ${{ env.MAINCLOUD_WS_URI }}
          BC_DEPLOY_EXPECT_DB: ${{ vars.BACKUP_DATABASE }}
        run: npm run test:e2e:deploy-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: deploy-smoke-report
          path: client/playwright-report/
          retention-days: 7

  # No automatic rollback exists (server/README.md): a published schema
  # cannot be rolled back. A red deploy on master must not sit unnoticed
  # in the Actions tab.
  report-failure:
    name: report-failure
    needs: [resolve, changes, backup, publish-module, deploy-client, smoke]
    if: always() && failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          bash scripts/ci/report-scheduled-failure.sh \
            "deploy failed" \
            "deploy.yml failed: $RUN_URL

          No automatic rollback exists (server/README.md's own manual recovery path): a published schema cannot be rolled back. Redeploy the last good SHA with workflow_dispatch once the cause is fixed; restore only through scripts/ops/restore-world.sh, into a fresh database. Close this once resolved."
