name: deploy

# Publishes the module to Maincloud and deploys the client to GitHub
# Pages -- the one path from a merge on master to a running game. Split
# out of #49/#266 (never provisioned there, would have been red on every
# push, no post-deploy verification); PR #288 landed this file itself
# before the `SPACETIME_MAINCLOUD_TOKEN`/`BACKUP_PASSPHRASE`
# (`maincloud` environment secrets, shared with backup.yml),
# `vars.BACKUP_DATABASE`/`vars.MAINCLOUD_OWNER_IDENTITY`/
# `vars.DEPLOY_ENABLED` variables, and the `github-pages` environment
# were provisioned -- see server/README.md.
#
# `vars.DEPLOY_ENABLED` (Quentin's direction, PR #288 cycle 1) is the
# gate for that ordering problem: until it is `true`, the `resolve` job
# below does nothing but emit a `::notice::` on a `workflow_run` trigger
# (every job downstream of it is skipped, cleanly -- `report-failure`
# never fires), so this workflow can land, merge and run on every push to
# master with zero effect and zero false alarms, before anything is
# provisioned. A `workflow_dispatch` while disabled is a loud failure
# instead, never a silent no-op -- a human asking this workflow to run
# needs to know why it did nothing.
#
# Trigger: `workflow_run` of `ci` on `master`, only when it actually
# succeeded -- this workflow deploys `ci`'s own head commit, never
# whatever master happens to be at by the time this runs. `workflow_dispatch`
# exists to retry a deploy or to smoke-test it after provisioning, without
# an empty commit to master; the `resolve` job refuses a dispatch unless
# its resolved commit is on `refs/heads/master` (github.ref itself, and
# an ancestor-of-master compare check -- `workflow_dispatch`'s own
# `github.sha` is the tip of whichever branch/ref it was run from, not
# necessarily master) whose own `ci` check run succeeded -- it retries a
# deploy that already passed CI on master, it does not skip CI or deploy
# an arbitrary branch.
#
# One credential, one owner identity (Quentin's direction): this reuses
# `backup.yml`'s own `SPACETIME_MAINCLOUD_TOKEN`/`BACKUP_PASSPHRASE`
# secrets and `vars.BACKUP_DATABASE` variable rather than adding a second
# copy of any -- a backup restorable only by an identity nobody holds is
# not a backup, so the identity that publishes here must be the same one
# that owns the live database backup.yml exports. `vars.
# MAINCLOUD_OWNER_IDENTITY` is the mechanical proof of that: every job
# that logs in compares the identity `spacetime login show` actually
# reports against it and refuses to continue if they differ, rather than
# trusting `--token`/`--no-config` silently did the right thing. Both
# secrets live in the `maincloud` environment (shared with backup.yml,
# restricted to master), not at repo scope: a repo-level secret is
# readable by any workflow anyone with push access can dispatch from
# their own branch; an environment restricted to master is not.
#
# Two publishes must never overlap, and a publish must never be killed
# halfway (a partial module publish or a partial Pages deploy is worse
# than a slow one) -- `concurrency` below queues a second run rather than
# cancelling the first.
#
# scripts/ci/check-deploy-workflow.sh is this file's own structural guard
# (run in `ci.yml`'s `scripts-tests` job on every change under
# `.github/workflows/**`): no destructive command or flag anywhere below,
# every job that publishes needs: (and can only run after) the `backup`
# job, and `backup`'s own first-deploy exception goes through
# `scripts/ops/check-database-exists.sh`, never an inline `spacetime
# describe`.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to the tip of master) -- must be on master with a green 'ci' check run"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # This repo is `Abaudat/browser-city` with no custom domain, so Pages
  # serves the client from this path, never the domain root.
  BASE_PATH: /browser-city/
  PAGES_URL: https://abaudat.github.io/browser-city/
  # server/AGENTS.md's server-alias table: `maincloud` resolves to
  # `https://maincloud.spacetimedb.com`; the client dials the same host
  # over `wss://`. Public information, not a secret -- unlike the
  # database name (`vars.BACKUP_DATABASE`), which is a repo variable so
  # it stays the single source both this workflow and backup.yml read.
  MAINCLOUD_WS_URI: wss://maincloud.spacetimedb.com

jobs:
  # Resolves the exact commit to deploy, refuses a dispatch that is not
  # on master or has not passed CI, and is the one place `vars.
  # DEPLOY_ENABLED` is read -- every other job trusts this job's `sha`/
  # `enabled` outputs rather than re-deriving either.
  resolve:
    name: resolve
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      enabled: ${{ steps.resolve.outputs.enabled }}
    permissions:
      contents: read
      checks: read
    steps:
      - name: resolve the commit to deploy, and refuse anything unsafe to deploy
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          DISPATCH_SHA: ${{ inputs.sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::deploy.yml only ever runs from refs/heads/master (got '$GITHUB_REF')" >&2
            exit 1
          fi

          if [ "$DEPLOY_ENABLED" != "true" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::vars.DEPLOY_ENABLED is not 'true' -- provisioning (server/README.md) is not complete yet; a dispatch must not silently no-op" >&2
              exit 1
            fi
            echo "::notice::vars.DEPLOY_ENABLED is not 'true' yet -- nothing is provisioned, so this run does nothing (not a failure)" >&2
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SHA="$WORKFLOW_RUN_SHA"
          else
            SHA="${DISPATCH_SHA:-$DEFAULT_SHA}"

            # workflow_dispatch's own github.sha is the tip of whichever
            # ref it was run from -- refuse anything not actually on
            # master's own history.
            COMPARE_STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...master" --jq '.status')"
            case "$COMPARE_STATUS" in
              identical|ahead) ;;
              *)
                echo "::error::refusing to deploy $SHA -- it is not an ancestor of master (compare status: '$COMPARE_STATUS')" >&2
                exit 1
                ;;
            esac

            # A dispatch retries a deploy that already passed CI; it does
            # not skip CI. Refuse outright rather than publish an
            # unvetted commit. per_page=100: ci.yml already runs more
            # than the default page size's worth of jobs, and a lost 'ci'
            # check run must read as "refuse", not "missing == also refuse
            # but for the wrong reason forever as the workflow grows".
            CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "ci")] | sort_by(.started_at) | last | .conclusion // "missing"')"
            if [ "$CONCLUSION" != "success" ]; then
              echo "::error::refusing to deploy $SHA -- its 'ci' check run did not succeed (conclusion: '$CONCLUSION')" >&2
              exit 1
            fi
          fi

          echo "resolve: deploying $SHA" >&2
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  # Whether the client actually needs to be redeployed -- compared
  # against what is actually live (Quentin's direction, PR #288 cycle 1),
  # never against the previous commit. A commit whose own deploy never
  # ran (CI cancelled by a fast-following push, or a prior deploy
  # failure) must not let a later, module-only commit read as "nothing
  # client-side changed" when the client that is actually live is still
  # the one before it. If the live page is unreachable or carries no
  # stamp, or the diff itself cannot be resolved, deploy -- the safe
  # default is always "ship the client", never "assume it's fine".
  changes:
    name: changes
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      client: ${{ steps.decide.outputs.client }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      # scripts/ci/decide-client-deploy.sh owns the stamp-parsing,
      # path-stripping and git-diff-exit-code logic, with its own fixture
      # tests under scripts/ci/tests -- the same move cycle 1 made for
      # backup's `describe` probe, and for the same reason: this decides
      # what ships to players, and untested bash inline in YAML is not
      # good enough for that.
      - name: does the deployed client need to change?
        id: decide
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          echo "client=$(bash scripts/ci/decide-client-deploy.sh "$SHA" "$PAGES_URL")" >> "$GITHUB_OUTPUT"

  # NFR39: the world is backed up before every publish. The one exception
  # is the very first deploy, when the database does not exist yet --
  # scripts/ops/check-database-exists.sh's own positive not-found check,
  # never `|| true` on the export itself: any other failure (a network
  # blip, a Maincloud 5xx, an auth problem) is a hard failure of this
  # job, not a silent skip. Also where the deploy identity is verified
  # (Quentin's direction): every later job that logs in repeats this
  # check rather than trusting an earlier job's login carried over --
  # each job is a fresh runner.
  backup:
    name: backup
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: maincloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
      - run: bash scripts/ci/install-spacetimedb-cli.sh "$RUNNER_TEMP/spacetimedb" >> "$GITHUB_PATH"
      # export-world.sh builds server/tools/world_backup the first time it
      # needs it -- same toolchain backup.yml's own export job installs.
      - run: cd server && rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server

      - name: check required secrets/variables are present (a missing one is a failure, never a skip)
        env:
          SPACETIME_MAINCLOUD_TOKEN: ${{ secrets.SPACETIME_MAINCLOUD_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_DATABASE: ${{ vars.BACKUP_DATABASE }}
          MAINCLOUD_OWNER_IDENTITY: ${{ vars.MAINCLOUD_OWNER_IDENTITY }}
        run: |
          missing=""
          [ -n "$SPACETIME_MAINCLOUD_TOKEN" ] || missing="$missing SPACETIME_MAINCLOUD_TOKEN"
          [ -n "$BACKUP_PASSPHRASE" ] || missing="$missing BACKUP_PASSPHRASE"
          [ -n "$BACKUP_DATABASE" ] || missing="$missing vars.BACKUP_DATABASE"
          [ -n "$MAINCLOUD_OWNER_IDENTITY" ] || missing="$missing vars.MAINCLOUD_OWNER_IDENTITY"
          if [ -n "$missing" ]; then
            echo "::error::deploy.yml (backup): missing required secret(s)/variable(s):$missing -- see server/README.md's Maincloud provisioning section" >&2
            exit 1
          fi

      - name: log into Maincloud with the deploy service identity
        env:
          SPACETIME_MAINCLOUD_TOKEN: ${{ secrets.SPACETIME_MAINCLOUD_TOKEN }}
        run: spacetime login --token "$SPACETIME_MAINCLOUD_TOKEN" --no-browser

      - name: prove the credential actually carried through -- the logged-in identity must own the live database
        env:
          MAINCLOUD_OWNER_IDENTITY: ${{ vars.MAINCLOUD_OWNER_IDENTITY }}
        run: |
          ACTUAL="$(spacetime login show | sed -n 's/^You are logged in as //p')"
          if [ "$ACTUAL" != "$MAINCLOUD_OWNER_IDENTITY" ]; then
            echo "::error::logged in as '$ACTUAL', expected the owner identity '$MAINCLOUD_OWNER_IDENTITY' (vars.MAINCLOUD_OWNER_IDENTITY) -- refusing to continue under the wrong identity" >&2
            exit 1
          fi
          echo "deploy: logged in as the expected owner identity ($ACTUAL)" >&2

      - name: does the live database already exist yet? (NFR39's one allowed exception -- the very first deploy)
        id: exists
        env:
          BACKUP_DATABASE: ${{ vars.BACKUP_DATABASE }}
        run: |
          EXISTS="$(bash scripts/ops/check-database-exists.sh "$BACKUP_DATABASE" --server maincloud)"
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          [ "$EXISTS" = "true" ] || echo "::notice::'$BACKUP_DATABASE' does not exist on Maincloud yet -- this is the first deploy, so there is nothing to back up" >&2

      - name: export the live database before publishing (NFR39)
        if: steps.exists.outputs.exists == 'true'
        env:
          BACKUP_DATABASE: ${{ vars.BACKUP_DATABASE }}
        run: bash scripts/ops/export-world.sh "$BACKUP_DATABASE" "$RUNNER_TEMP/export" --server maincloud

      - name: encrypt the export before it ever touches an artifact
        if: steps.exists.outputs.exists == 'true'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/export.tar.gz" export
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-fd 0 \
            --output "$RUNNER_TEMP/export.tar.gz.gpg" "$RUNNER_TEMP/export.tar.gz"
          rm -f "$RUNNER_TEMP/export.tar.gz"
          rm -rf "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.exists.outputs.exists == 'true'
        with:
          name: pre-deploy-export-${{ github.run_id }}
          path: ${{ runner.temp }}/export.tar.gz.gpg
          retention-days: 90

  # Publishes the module to Maincloud and lands any newly-added
  # sim::codes rows -- server/README.md names this job as `reseed_codes`'s
  # automated caller. NFR33 (an additive-only schema, enforced at PR time
  # by check-schema-additive.sh) is what makes forward-only the only
  # publish this job ever has to make -- see server/README.md's Maincloud
  # recovery section.
  publish-module:
    name: publish-module
    needs: [resolve, backup]
    if: needs.resolve.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: maincloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
      - run: bash scripts/ci/install-spacetimedb-cli.sh "$RUNNER_TEMP/spacetimedb" >> "$GITHUB_PATH"
      - run: cd server && rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server

      - name: check required secrets/variables are present (a missing one is a failure, never a skip)
        env:
          SPACETIME_MAINCLOUD_TOKEN: ${{ secrets.SPACETIME_MAINCLOUD_TOKEN }}
          BACKUP_DATABASE: ${{ vars.BACKUP_DATABASE }}
          MAINCLOUD_OWNER_IDENTITY: ${{ vars.MAINCLOUD_OWNER_IDENTITY }}
        run: |
          missing=""
          [ -n "$SPACETIME_MAINCLOUD_TOKEN" ] || missing="$missing SPACETIME_MAINCLOUD_TOKEN"
          [ -n "$BACKUP_DATABASE" ] || missing="$missing vars.BACKUP_DATABASE"
          [ -n "$MAINCLOUD_OWNER_IDENTITY" ] || missing="$missing vars.MAINCLOUD_OWNER_IDENTITY"
          if [ -n "$missing" ]; then
            echo "::error::deploy.yml (publish-module): missing required secret(s)/variable(s):$missing -- see server/README.md's Maincloud provisioning section" >&2
            exit 1
          fi

      - name: log into Maincloud with the deploy service identity
        env:
          SPACETIME_MAINCLOUD_TOKEN: ${{ secrets.SPACETIME_MAINCLOUD_TOKEN }}
        run: spacetime login --token "$SPACETIME_MAINCLOUD_TOKEN" --no-browser

      - name: prove the credential actually carried through -- the logged-in identity must own the live database
        env:
          MAINCLOUD_OWNER_IDENTITY: ${{ vars.MAINCLOUD_OWNER_IDENTITY }}
        run: |
          ACTUAL="$(spacetime login show | sed -n 's/^You are logged in as //p')"
          if [ "$ACTUAL" != "$MAINCLOUD_OWNER_IDENTITY" ]; then
            echo "::error::logged in as '$ACTUAL', expected the owner identity '$MAINCLOUD_OWNER_IDENTITY' (vars.MAINCLOUD_OWNER_IDENTITY) -- refusing to publish under the wrong identity" >&2
            exit 1
          fi
          echo "deploy: logged in as the expected owner identity ($ACTUAL)" >&2

      - name: publish the module to Maincloud
        env:
          BACKUP_DATABASE: ${{ vars.BACKUP_DATABASE }}
        run: spacetime publish --server maincloud --no-config -y "$BACKUP_DATABASE" --module-path server

      - name: land any newly-added sim::codes rows (NFR36/NFR38) -- server/README.md's own manual step, now automated here
        env:
          BACKUP_DATABASE: ${{ vars.BACKUP_DATABASE }}
        run: spacetime call --server maincloud --no-config -y "$BACKUP_DATABASE" reseed_codes

  # Builds the production client and deploys it to GitHub Pages. Skips on
  # a module-only change (`needs.changes.outputs.client == 'false'`); the
  # `smoke` job below still runs in that case, against the client that is
  # already deployed.
  deploy-client:
    name: deploy-client
    needs: [resolve, changes, publish-module]
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Full checkout, never sparse or client/-only (docs/architecture.md):
      # the test street reads ModernTileset/** straight off the repo root
      # at runtime.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: production build -- the real Pages base and the real Maincloud coordinates
        working-directory: client
        env:
          VITE_SPACETIME_URI: ${{ env.MAINCLOUD_WS_URI }}
          VITE_SPACETIME_DB: ${{ vars.BACKUP_DATABASE }}
        run: npx vite build --base="$BASE_PATH"

      - name: stamp the build with the exact commit deployed -- the smoke job's own propagation check
        working-directory: client
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: bash ../scripts/ci/stamp-build.sh dist/index.html "$SHA"

      - name: base path and production URI both check out -- fails before Pages ever serves it
        run: bash scripts/ci/check-pages-bundle.sh client/dist "$BASE_PATH" "$MAINCLOUD_WS_URI"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: client/dist
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # A publish or a client bundle that does not actually work must never be
  # a green workflow (the issue's own framing). Runs whenever
  # `publish-module` succeeded, whether or not `deploy-client` ran: a
  # module-only change can break a client that is already deployed.
  smoke:
    name: smoke
    needs: [resolve, changes, publish-module, deploy-client]
    if: |
      always() &&
      needs.publish-module.result == 'success' &&
      (needs.deploy-client.result == 'success' || needs.deploy-client.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - working-directory: client
        run: npx playwright install --with-deps chromium

      - name: check required secrets/variables are present (a missing one is a failure, never a skip)
        env:
          BACKUP_DATABASE: ${{ vars.BACKUP_DATABASE }}
        run: |
          missing=""
          [ -n "$BACKUP_DATABASE" ] || missing="$missing vars.BACKUP_DATABASE"
          if [ -n "$missing" ]; then
            echo "::error::deploy.yml (smoke): missing required secret(s)/variable(s):$missing -- see server/README.md's Maincloud provisioning section" >&2
            exit 1
          fi

      # Pages propagation can lag: this job would otherwise pass against
      # the *previous* deploy. Skipped when deploy-client itself did not
      # run (a module-only change) -- the live page did not change, so
      # there is no new SHA to wait for.
      - name: wait for Pages to actually serve this exact commit
        if: needs.deploy-client.result == 'success'
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          . scripts/ci/lib/bc-build-stamp.sh
          DEADLINE=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            LIVE_SHA="$(curl -sf "$PAGES_URL" 2>/dev/null | bc_build_stamp_extract || true)"
            if [ "$LIVE_SHA" = "$SHA" ]; then
              echo "deploy: $PAGES_URL now serves $SHA" >&2
              exit 0
            fi
            sleep 5
          done
          echo "::error::$PAGES_URL did not serve commit $SHA within 300s -- Pages propagation failed, or the deploy is broken" >&2
          exit 1

      # A real Playwright spec, not an HTTP 200 check (the issue's own
      # framing): asserts no failed request, no console error, the
      # WebSocket dials the configured Maincloud URI and database, the
      # initial subscription applies, and the player-controllable mark
      # fires. `ci.yml`'s `e2e` job runs the identical spec against a
      # production-base build under /browser-city/, backed by a
      # disposable local SpacetimeDB, so a broken spec is caught before
      # merge. Every run connects as a fresh, anonymous identity, exactly
      # like every real player -- `identity_connected` (server/src/lib.rs)
      # writes nothing today, so nothing is polluted; deferred trace-
      # matrix row for when the first story gives that reducer a body.
      - name: post-deploy smoke check against the live URL
        working-directory: client
        env:
          BC_DEPLOY_URL: ${{ env.PAGES_URL }}
          BC_DEPLOY_EXPECT_WS_ORIGIN: ${{ env.MAINCLOUD_WS_URI }}
          BC_DEPLOY_EXPECT_DB: ${{ vars.BACKUP_DATABASE }}
        run: npm run test:e2e:deploy-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: deploy-smoke-report
          path: client/playwright-report/
          retention-days: 7

  # No automatic rollback exists (server/README.md): a published schema
  # cannot be rolled back, only rolled forward. A red deploy on master
  # must not sit unnoticed in the Actions tab.
  report-failure:
    name: report-failure
    needs: [resolve, changes, backup, publish-module, deploy-client, smoke]
    if: always() && failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          bash scripts/ci/report-scheduled-failure.sh \
            "deploy failed" \
            "deploy.yml failed: $RUN_URL

