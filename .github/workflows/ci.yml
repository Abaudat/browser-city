name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROPTEST_CASES: 4096

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agentic: ${{ steps.filter.outputs.agentic }}
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      e2e: ${{ steps.filter.outputs.e2e }}
      defs: ${{ steps.filter.outputs.defs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # A change under scripts/** or .github/** can affect any job group's
      # own checks, so it is folded into every filter below rather than
      # kept as a fifth output nothing reads.
      #
      # The rule for every filter, checked whenever a job gains a step:
      # list every path that job's checks actually read, not just the
      # source tree its name suggests. A filter that misses one of its
      # guard's inputs is a guard that silently does not run on exactly
      # the PR that changes that input -- e.g. `client-check` runs
      # check-bindings-current.sh and check-no-shared-code.sh, both of
      # which read server/ (the bindings check regenerates from
      # --module-path server; the shared-code check greps server/** for
      # references into client/), so `client` lists server/** too. That
      # makes `client` and `e2e` identical today, which is fine and
      # honest: the client's checks genuinely depend on the module.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            agentic:
              - 'agentic-team/**'
              - 'scripts/**'
              - '.github/**'
              - '.mcp.json'
              - '.claude/**'
              - 'docs/architecture.md'
              - 'spacetime.json'
              - 'spacetime.local.json'
              # check-agent-tooling.sh cross-checks the CLI's version pin
              # against this file too.
              - 'server/Cargo.toml'
              # check-spike-pin.sh (this job) cross-checks the
              # spike report's measured version against docs/architecture.md
              # (already listed above) and the pinned installer script,
              # already under scripts/**.
              - 'docs/spikes/**'
            server:
              - 'server/**'
              - 'scripts/**'
              - '.github/**'
              - 'docs/trace-matrix.md'
              # server/bounds/tests/world_fixture_current.rs regenerates
              # and diffs this file -- a hand-edit here with no server/
              # change must still trip the job that catches it.
              - 'fixtures/**'
              # Explicit, though already implied by server/** -- Tim's
              # direction: a defs change re-runs the build that consumes
              # its own generated half.
              - 'server/sim/src/generated/defs.rs'
            client:
              - 'client/**'
              - 'server/**'
              - 'scripts/**'
              - '.github/**'
              - 'fixtures/**'
              - 'client/public/defs/defs.json'
            e2e:
              - 'server/**'
              - 'client/**'
              - 'scripts/**'
              - '.github/**'
              - 'fixtures/**'
            defs:
              - 'defs/**'
              - 'tools/defs-build/**'
              - 'server/sim/src/generated/defs.rs'
              - 'client/public/defs/defs.json'
              - 'scripts/**'
              - '.github/**'

  scripts-tests:
    name: scripts-tests
    needs: changes
    if: needs.changes.outputs.agentic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # gh and jq are already on ubuntu-latest; orca and claude are not, and
      # never will be in CI (they are the Windows dev machine's own tools).
      # bc_init only ever checks that all four *exist* -- the whole suite
      # below runs under BC_FAKE, which never actually invokes them -- so a
      # no-op stub of the two missing ones is enough to let it run at all.
      - name: stub the orca/claude CLIs bc_init requires but never calls under BC_FAKE
        run: |
          mkdir -p "$RUNNER_TEMP/stub-bin"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/stub-bin/orca"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/stub-bin/claude"
          chmod +x "$RUNNER_TEMP/stub-bin/orca" "$RUNNER_TEMP/stub-bin/claude"
          echo "$RUNNER_TEMP/stub-bin" >> "$GITHUB_PATH"
      # No toolchain needed and sub-second to run -- fails before run-all.sh's
      # much larger suite gets a chance to. check-spike-pin.sh is
      # four greps against committed files, not a server-workspace check
      # (it needs no cargo, no spacetime instance) -- it belongs here, not
      # in the `check` job, so a docs/spikes/** edit never spins up
      # `migrate`'s real local SpacetimeDB instance to protect it.
      - run: bash scripts/ci/check-agent-tooling.sh
      - run: bash scripts/ci/check-spike-pin.sh docs/spikes/1.3-scheduled-reducer-timing.md sched-timing-spacetimedb-version
      - run: bash scripts/ci/check-spike-pin.sh docs/spikes/1.4-backup-restore.md backup-spacetimedb-version
      - run: bash agentic-team/scripts/tests/run-all.sh

  defs:
    name: defs
    needs: changes
    if: needs.changes.outputs.defs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/defs-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-defs-version-bump.sh diffs against a base commit, so
          # this job alone needs history; the generator's own tests and
          # check-defs-current.sh only need HEAD.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/defs-build
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: the generator's own unit and fixture tests
        run: cargo test
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-llvm-cov@0.9.1
      # `--lib` only (Quentin's direction: the error branches are what
      # must be covered, and the extensive failure-fixture suite is what
      # exercises them) -- the `defs-build` binary's own `main`/`run` are
      # thin CLI wiring already exercised for real by check-defs-
      # current.sh above, the same reasoning NFR28 already applies to a
      # reducer's own thin wrapper.
      - run: cargo llvm-cov --lib --fail-under-lines 90
      # Not gated behind build/migrate/e2e (Quentin's direction): needs
      # only this crate's own Rust toolchain, so a bad defs edit is red in
      # a couple of minutes, not after the slowest job in the graph.
      - name: story 2.1 AC1/AC4, both generated artefacts match defs/
        run: bash ../../scripts/ci/check-defs-current.sh
      - name: story 2.1, an id or key is never renumbered, reused or retired
        run: bash ../../scripts/ci/check-defs-ids-append-only.sh
      - name: story 2.1 AC3, any defs/ change bumps defs_version
        run: bash ../../scripts/ci/check-defs-version-bump.sh

  check:
    name: check
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-golden-version-bump.sh diffs against a base commit, so
          # this job alone needs history; test/build only need HEAD.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: bash ../scripts/ci/check-sim-purity.sh
      - run: bash ../scripts/ci/check-golden-version-bump.sh
      - run: bash ../scripts/ci/check-codes-append-only.sh
      - run: bash ../scripts/ci/check-schema-additive.sh

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - run: rustup toolchain install
      - name: native tests, including the property suite, in release
        run: cargo test --workspace --exclude browser_city --exclude sched_timing_spike --release
      - run: bash ../scripts/ci/check-trace-matrix.sh

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - run: rustup toolchain install
      - name: the module actually has to compile for the thing it runs on
        run: cargo build --target wasm32-unknown-unknown --release -p browser_city
      # A pin check that orders a re-run at the next version bump guards
      # nothing if the harness it points at has silently stopped
      # compiling since (Tim's direction) -- this is excluded from the
      # `test` job's `cargo test` (host-FFI symbols, cannot link
      # natively, same reason browser_city is excluded), so its only
      # compile check anywhere is here.
      - name: the timing spike's own module must still compile too
        run: cargo build --target wasm32-unknown-unknown --release -p sched_timing_spike

  migrate:
    name: migrate
    needs: [changes, build]
    # `needs: build` too, so a module that does not compile never spins up
    # an instance -- but this job's own gate is the `server` filter alone
    # (check-ci-gate.sh requires exactly one `needs.changes.outputs.*`
    # reference per job).
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            server
            server/tests/fixtures
      - run: bash scripts/ci/install-spacetimedb-cli.sh "$RUNNER_TEMP/spacetimedb" >> "$GITHUB_PATH"
      # Story 1.4: scripts/ops/'s own fast, stub-`spacetime` tests --
      # never a real instance, but they build server/tools/world_backup
      # (cargo/rustup already set up in this job), so they run here
      # rather than in scripts-tests, which has neither. Runs before
      # either real-instance step below (Quentin's fail-fast direction):
      # a cheap, no-instance suite should fail before this job pays for
      # starting one, not after.
      - name: story 1.4, scripts/ops/'s own fast failure-path tests
        run: bash scripts/ops/tests/run-all.sh
      - name: story 1.2 AC3, proven against a real SpacetimeDB instance
        run: bash scripts/ci/check-live-migration.sh
      # Story 1.4: its own disposable local instance and port (3988),
      # never 3987 (check-live-migration.sh's) -- run in the same job
      # rather than a second one only because a module build is already
      # available here (Tim's direction), not because an instance is
      # shared between the two steps.
      - name: story 1.4 AC3/AC4, the restore proven against a real SpacetimeDB instance
        run: bash scripts/ci/check-backup-restore.sh

  coverage:
    name: coverage (sim)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - run: rustup toolchain install
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-llvm-cov@0.9.1
      # sim is pure, has no dependencies and is where the game logic will
      # live -- it has no excuse for an uncovered line. Scoped to sim only:
      # a repo-wide percentage gate only teaches people to write
      # assertion-free tests to pad it.
      - run: cargo llvm-cov -p sim --fail-under-lines 90

  client-check:
    name: client-check
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run lint
      - run: npm run test:unit:coverage
      - run: rustup toolchain install
      # $GITHUB_PATH only takes effect from the *next* step onward, never
      # within the step that writes it -- so the CLI install and the check
      # that calls it cannot share one `run:` block.
      - run: bash ../scripts/ci/install-spacetimedb-cli.sh "$RUNNER_TEMP/spacetimedb" >> "$GITHUB_PATH"
      - name: bindings are exactly what the module generates
        run: bash ../scripts/ci/check-bindings-current.sh
      - run: bash ../scripts/ci/check-no-shared-code.sh

  client-build:
    name: client-build
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: the e2e test hook must not ship in the production bundle
        run: |
          if grep -rq '__bc' dist/assets/*.js; then
            echo "::error::window.__bc leaked into the production bundle -- import.meta.env.DEV did not strip it" >&2
            exit 1
          fi

  e2e:
    name: e2e
    needs: [changes, client-build]
    # Spans the boundary the other jobs don't -- runs whenever either half
    # changed, and is the slowest thing in the repo, so it must never be
    # what tells us a formatting error exists (client-check already did).
    # `client-build` is itself gated on `client` changing, so a server-only
    # change (where `e2e` is still 'true') leaves it `skipped`, not
    # `success` -- the default implicit "needs succeeded" would skip this
    # job too without the explicit result check below.
    if: |
      always() &&
      needs.changes.outputs.e2e == 'true' &&
      (needs.client-build.result == 'success' || needs.client-build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - run: bash scripts/ci/install-spacetimedb-cli.sh "$RUNNER_TEMP/spacetimedb" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - name: cache Playwright browsers, keyed to the pinned package version
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
      - working-directory: client
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - working-directory: client
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - working-directory: client
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/test-results/spacetime-start.log
          retention-days: 7

  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [changes, scripts-tests, defs, check, test, build, migrate, coverage, client-check, client-build, e2e]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # A job that is `skipped` is not automatically a failure here: it is
      # only correct if the `changes` filter that gates it says the paths
      # it cares about did not change. See that script for why this lives
      # here rather than as an inline expression.
      - run: |
          bash scripts/ci/check-ci-gate.sh \
            '${{ toJSON(needs) }}' \
            '${{ toJSON(needs.changes.outputs) }}'
