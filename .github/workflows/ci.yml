name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROPTEST_CASES: 4096
  # NFR50: every property test in this workflow draws its inputs from this
  # one fixed seed (proptest's `PROPTEST_RNG_SEED`), so a run's verdict is
  # the same on every retry and on master's merge commit as on the PR. With
  # a fixed RNG seed every property in a file draws the same 4,096
  # `any::<u64>()` world seeds. A failure reproduces locally with the line
  # the `test` job prints; `.github/workflows/explore.yml` draws fresh seeds
  # off the deploy path. `FAST_CHECK_SEED` does the same for the client's
  # fast-check properties, through the one vitest setup file.
  PROPTEST_RNG_SEED: 20260929
  FAST_CHECK_SEED: 20260929

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agentic: ${{ steps.filter.outputs.agentic }}
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      e2e: ${{ steps.filter.outputs.e2e }}
      defs: ${{ steps.filter.outputs.defs }}
      bootbudget: ${{ steps.filter.outputs.bootbudget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # Story 15.7: no committed text file under docs/, scripts/, .github/ or
      # client/ carries a CR -- a CRLF commit turns every line of a file into a
      # change. Here, not in a filtered job, so it runs on every push (a
      # client-only or docs-only PR included), before any filter is computed.
      - run: bash scripts/ci/check-no-crlf-committed.sh
      # A change under scripts/** or .github/** can affect any job group's
      # own checks, so it is folded into every filter below rather than
      # kept as a fifth output nothing reads.
      #
      # The rule for every filter, checked whenever a job gains a step:
      # list every path that job's checks actually read, not just the
      # source tree its name suggests. A filter that misses one of its
      # guard's inputs is a guard that silently does not run on exactly
      # the PR that changes that input -- e.g. `client-check` runs
      # check-bindings-current.sh and check-no-shared-code.sh, both of
      # which read server/ (the bindings check regenerates from
      # --module-path server; the shared-code check greps server/** for
      # references into client/), so `client` lists server/** too. That
      # makes `client` and `e2e` identical today, which is fine and
      # honest: the client's checks genuinely depend on the module.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            agentic:
              - 'agentic-team/**'
              - 'scripts/**'
              - '.github/**'
              - '.mcp.json'
              - '.claude/**'
              - 'docs/architecture.md'
              - 'spacetime.json'
              - 'spacetime.local.json'
              # check-agent-tooling.sh cross-checks the CLI's version pin
              # against this file too.
              - 'server/Cargo.toml'
              # check-spike-pin.sh (this job) cross-checks the
              # spike report's measured version against docs/architecture.md
              # (already listed above) and the pinned installer script,
              # already under scripts/**.
              - 'docs/spikes/**'
            server:
              - 'server/**'
              - 'scripts/**'
              - '.github/**'
              - 'docs/trace-matrix.md'
              # server/sim/tests/rule_examples.rs (every_committed_rule_
              # has_a_current_row_in_the_generation_document) reads this
              # file directly -- a docs-only edit that drops or misdates
              # a committed rule's own row must still trip the `test`
              # job, exactly like docs/trace-matrix.md above (story 3.1,
              # Quentin's direction).
              - 'docs/generation.md'
              # server/bounds/tests/world_fixture_current.rs regenerates
              # and diffs this file -- a hand-edit here with no server/
              # change must still trip the job that catches it.
              - 'fixtures/**'
              # Story 3.2: server/bounds/tests/generation_evidence_
              # current.rs regenerates and diffs these SVGs -- a hand-edit
              # here with no server/ change must still trip the job that
              # catches it.
              - 'docs/generation/**'
              # Explicit, though already implied by server/** -- Tim's
              # direction: a defs change re-runs the build that consumes
              # its own generated half.
              - 'server/sim/src/generated/defs.rs'
            client:
              - 'client/**'
              - 'server/**'
              - 'scripts/**'
              - '.github/**'
              - 'fixtures/**'
              - 'client/public/defs/defs.json'
              # Story 1.14, cycle 2 (Tim's direction): check-boot-budget-
              # report-current.sh regenerates docs/spikes/1.14-boot-
              # budget.md from exactly these paths.
              - 'docs/spikes/1.14-boot-budget/**'
              - 'docs/spikes/1.14-boot-budget.md'
            e2e:
              - 'server/**'
              - 'client/**'
              - 'scripts/**'
              - '.github/**'
              - 'fixtures/**'
              # Story 2.8 (Quentin's direction): client/tests/e2e/defs-
              # handshake.spec.ts exercises a stale defs_version, so a
              # defs/**-only PR (client/**/server/** untouched) must still
              # run it -- client/public/defs/** and client/public/atlas/**
              # are already covered transitively via client/** above.
              - 'defs/**'
            defs:
              - 'defs/**'
              - 'tools/defs-build/**'
              - 'server/sim/src/generated/defs.rs'
              - 'client/public/defs/defs.json'
              - 'scripts/**'
              - '.github/**'
              # Story 1.10/2.2: tools/defs-build reads every appearance
              # part's and every object's own `sheet`/`sprite.sheet` IHDR,
              # and a `sprite.sheet` may name any path under this whole
              # root (`model.rs`'s `SPRITE_SHEET_ALLOWED_ROOT`) -- a PR
              # that only swaps one vendor PNG anywhere under it must
              # still run that check (Quentin's direction, cycle 1: the
              # simpler of two acceptable fixes over narrowing to one
              # subtree, which the previous two lines here did --
              # `scripts/ci/check-defs-sprite-root-filter.sh` pins this
              # line to that same constant, so the two can never drift).
              - 'ModernTileset/**'
              # tools/defs-build/tests/shared_malformed_cases.rs does
              # include_str!(this file) -- a PR that only edits the shared
              # case list must still run the Rust half of the drift guard,
              # not just the client's own test (already covered by
              # fixtures/** below via its own filter membership elsewhere).
              - 'fixtures/**'
              # Story 2.6: the packed atlas pages this job's own
              # check-defs-current.sh regenerates and diffs -- inside
              # client/**, but the `defs:` filter above does not include
              # `client/**` itself, so listed explicitly here
              # (scripts/ci/check-atlas-filter.sh pins this line to
              # tools/defs-build/src/model.rs's own ATLAS_PAGES_DIR, so
              # the two can never drift).
              - 'client/public/atlas/**'
            # Story 1.14, cycle 2 (Quentin's direction): the boot-budget
            # harness has never run on Linux (`boot-budget.yml` is
            # workflow_dispatch-only), and the script has Windows-specific
            # process handling -- this is deliberately narrow, only the
            # paths the harness itself needs to keep working, not every
            # client/server change.
            bootbudget:
              - 'scripts/dev/run-boot-budget-spike.sh'
              - 'client/tests/e2e/boot-budget/**'
              - 'server/spikes/boot_budget/**'
              - 'client/playwright.config.ts'
              - 'client/vite.config.ts'

  scripts-tests:
    name: scripts-tests
    needs: changes
    if: needs.changes.outputs.agentic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # gh and jq are already on ubuntu-latest; orca and claude are not, and
      # never will be in CI (they are the Windows dev machine's own tools).
      # bc_init only ever checks that all four *exist* -- the whole suite
      # below runs under BC_FAKE, which never actually invokes them -- so a
      # no-op stub of the two missing ones is enough to let it run at all.
      - name: stub the orca/claude CLIs bc_init requires but never calls under BC_FAKE
        run: |
          mkdir -p "$RUNNER_TEMP/stub-bin"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/stub-bin/orca"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/stub-bin/claude"
          chmod +x "$RUNNER_TEMP/stub-bin/orca" "$RUNNER_TEMP/stub-bin/claude"
          echo "$RUNNER_TEMP/stub-bin" >> "$GITHUB_PATH"
      # No toolchain needed and sub-second to run -- fails before run-all.sh's
      # much larger suite gets a chance to. check-spike-pin.sh is
      # four greps against committed files, not a server-workspace check
      # (it needs no cargo, no spacetime instance) -- it belongs here, not
      # in the `check` job, so a docs/spikes/** edit never spins up
      # `migrate`'s real local SpacetimeDB instance to protect it.
      - run: bash scripts/ci/check-agent-tooling.sh
      - run: bash scripts/ci/check-spike-pin.sh docs/spikes/1.3-scheduled-reducer-timing.md sched-timing-spacetimedb-version
      - run: bash scripts/ci/check-spike-pin.sh docs/spikes/1.4-backup-restore.md backup-spacetimedb-version
      - run: bash scripts/ci/check-spike-pin.sh docs/spikes/1.14-boot-budget.md boot-budget-spacetimedb-version
      # The deploy story: no destructive command or flag anywhere in
      # deploy.yml, and every job that publishes needs: (and can only run
      # after) its backup job (NFR39). Same reasoning as the checks above
      # -- a workflow-structure guard, not a server-workspace one.
      - run: bash scripts/ci/check-deploy-workflow.sh
      # Story 4.13: watch.yml's own shape (scheduled, gated, secrets only
      # through env:, reports on failure() || cancelled()).
      - run: bash scripts/ci/check-watch-workflow.sh
      # Story 4.21: explore.yml never runs on push or pull_request.
      - run: bash scripts/ci/check-explore-workflow.sh
      # NFR49: e2e is N shards inside the timeout budget; perf runs apart.
      - run: bash scripts/ci/check-e2e-shards.sh
      # The deploy story: deploy.yml's own client-changed decision reads
      # scripts/ci/lib/deploy-client-paths.txt -- this job's own `client:`
      # filter (below) must stay a superset of it, or the two silently
      # drift apart.
      - run: bash scripts/ci/check-deploy-client-paths-current.sh
      # story 2.2, cycle 2 (Quentin's direction): the defs: job must be
      # the one running check-layer-table-current.sh, since client-check's
      # own filter never covers tools/defs-build/**.
      - run: bash scripts/ci/check-layer-table-guard-wired.sh
      # scripts/ci/'s own fast, no-toolchain-needed tests for its
      # mechanical guards (e.g. check-no-masks.sh's own pattern, story 1.7
      # cycle 2) -- runs here, not in `client-check`, since it needs
      # nothing client-check's own toolchain provides.
      - run: bash scripts/ci/tests/run-all.sh
      # check-scotty-commands.sh -- Story 4.17: keeps scotty.md, the prompts
      # and the bc-sdlc skill table honest against bc-issue.sh's own usage().
      # Runs before run-all.sh's much larger fixture suite, same reasoning as
      # check-agent-tooling.sh above.
      - run: bash scripts/ci/check-scotty-commands.sh
      - run: bash agentic-team/scripts/tests/run-all.sh

  defs:
    name: defs
    needs: changes
    if: needs.changes.outputs.defs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/defs-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-defs-version-bump.sh diffs against a base commit, so
          # this job alone needs history; the generator's own tests and
          # check-defs-current.sh only need HEAD.
          fetch-depth: 0
      # Story 2.3, Quentin's direction: plain grep guards, no toolchain
      # needed -- run before the cargo steps below so a violation fails
      # in seconds, not after the whole build/test/coverage run.
      - name: story 2.3 AC3, the proposer never hardcodes a committed key or sheet filename
        run: bash ../../scripts/ci/check-proposer-no-content-keys.sh
      - name: story 2.3 AC3/AC4, archetype and the proposer never reach a runtime
        run: bash ../../scripts/ci/check-no-runtime-footprint-inference.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/defs-build
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: property-test seed (reproduce a failure locally with this line)
        run: |
          echo "PROPTEST_CASES=$PROPTEST_CASES PROPTEST_RNG_SEED=$PROPTEST_RNG_SEED"
          echo "reproduce: PROPTEST_RNG_SEED=$PROPTEST_RNG_SEED PROPTEST_CASES=$PROPTEST_CASES cargo test -- <test>" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: the generator's own unit and fixture tests
        run: cargo test
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-llvm-cov@0.9.1
      # Scope the *report*, not the *run* (Quentin's direction): `--lib`
      # would scope the run itself and silently skip `tests/
      # failure_fixtures.rs`/`tests/shared_malformed_cases.rs` -- the
      # fourteen-plus fixture tests that exercise the error branches this
      # gate exists to hold accountable. Running the whole test binary set
      # and excluding only `src/bin/` from the *report* is what actually
      # measures what the comment above always claimed: the `defs-build`
      # binary's own thin CLI wiring is exercised for real by check-defs-
      # current.sh below, the same reasoning NFR28 applies to a reducer's
      # own thin wrapper, so it is excluded from the number, not from the
      # run that produces it.
      - run: cargo llvm-cov --fail-under-lines 90 --ignore-filename-regex 'src/bin/'
      # Not gated behind build/migrate/e2e (Quentin's direction): needs
      # only this crate's own Rust toolchain, so a bad defs edit is red in
      # a couple of minutes, not after the slowest job in the graph.
      - name: story 2.1 AC1/AC4, both generated artefacts match defs/
        run: bash ../../scripts/ci/check-defs-current.sh
      - name: story 2.1, an id or key is never renumbered, reused or retired
        run: bash ../../scripts/ci/check-defs-ids-append-only.sh
      - name: story 2.1 AC3, any defs/ change bumps defs_version
        run: bash ../../scripts/ci/check-defs-version-bump.sh
      - name: story 2.1 AC3, nothing versions independently -- a direct pin
        run: bash ../../scripts/ci/check-defs-version-agrees.sh
      - name: story 2.2 FR128, there is no separate walkable field anywhere in the schema
        run: bash ../../scripts/ci/check-no-walkable-field.sh
      - name: story 2.2, ci.yml's defs filter covers the whole sprite-sheet allowed root
        run: bash ../../scripts/ci/check-defs-sprite-root-filter.sh
      - name: story 2.6, ci.yml's defs filter covers the packed atlas pages directory
        run: bash ../../scripts/ci/check-atlas-filter.sh
      - name: story 2.10 AC3, the rule engine never hardcodes a content key
        run: bash ../../scripts/ci/check-rule-engine-no-content-keys.sh
      - name: story 3.4, the generator never hardcodes a content key
        run: bash ../../scripts/ci/check-generator-no-content-keys.sh
      # RULE_SOURCE_SKIP_TREE_CHECK=1 (Quentin's direction, cycle 2): this
      # job's own filter does not own the resolved-feature-graph question
      # -- it runs from tools/defs-build's own workspace, not server's --
      # so it pays only the fast, no-cargo-invocation checks; the `check`
      # job below, which already has the server toolchain, runs the full
      # thing including the cargo tree resolution.
      - name: story 2.11 AC1/AC4, the generator and the harness read one rule source
        run: RULE_SOURCE_SKIP_TREE_CHECK=1 bash ../../scripts/ci/check-rule-source.sh
      # Quentin's direction, cycle 2: client-check's own filter (client/**,
      # server/**, scripts/**, .github/**, fixtures/**) never covers
      # tools/defs-build/**, so a PR that only edits defs-build's codes.rs' own
      # DEPRECATED_LAYER_NAMES would skip client-check entirely and this
      # drift guard would never run. Runs here too -- plain text, no
      # toolchain, costs nothing -- so the defs filter (which does cover
      # tools/defs-build/**) is what actually protects it.
      - name: story 2.2, defs-build's DEPRECATED_LAYER_NAMES never drifts from codes.rs
        run: bash ../../scripts/ci/check-layer-table-current.sh

  check:
    name: check
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-golden-version-bump.sh diffs against a base commit, so
          # this job alone needs history; test/build only need HEAD.
          fetch-depth: 0
      # Toolchain-free guards first, so a fiat stock write is red in seconds.
      - name: story 6.3 FR89, nothing but restore and metrics names the stock accessor
        run: bash ../scripts/ci/check-stock-write-path.sh
      - name: story 3.13 FR110, every generation draw goes through Rng::below and every harness through plan/generate
        run: bash ../scripts/ci/check-generation-entry-point.sh
      - name: story 3.13 FR108/FR109, one writer for the district record
        run: bash ../scripts/ci/check-district-write-path.sh
      - name: story 6.3 FR89, nothing outside sim::author builds an Author
        run: bash ../scripts/ci/check-author-construction.sh
      - name: story 4.5 FR142, only tables/identity.rs reaches a character from a caller
        run: bash ../scripts/ci/check-character-identity-path.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: bash ../scripts/ci/check-sim-purity.sh
      - name: story 4.2, no ScheduleAt::Interval and no unwrap/expect/panic under server/src (NFR41)
        run: bash ../scripts/ci/check-server-src-bans.sh
      - name: story 4.13 NFR17, every reducer and procedure opens with count_call
        run: bash ../scripts/ci/check-reducer-counted.sh
      - name: story 3.11 FR131, the travel-time estimator is graph-free and collection-free
        run: bash ../scripts/ci/check-routing-estimate-purity.sh
      - run: bash ../scripts/ci/check-golden-version-bump.sh
      - run: bash ../scripts/ci/check-codes-append-only.sh
      - run: bash ../scripts/ci/check-schema-additive.sh
      - name: story 2.10 AC3, the rule engine never hardcodes a content key
        run: bash ../scripts/ci/check-rule-engine-no-content-keys.sh
      - name: story 6.8, the cash module never hardcodes a denomination key
        run: bash ../scripts/ci/check-rule-engine-no-content-keys.sh "$GITHUB_WORKSPACE/tools/defs-build/goldens/defs-manifest.golden" "$GITHUB_WORKSPACE/server/sim/src/cash.rs"
      - name: story 3.4, the generator never hardcodes a content key
        run: bash ../scripts/ci/check-generator-no-content-keys.sh
      - name: story 2.11 AC1/AC4, the generator and the harness read one rule source
        run: bash ../scripts/ci/check-rule-source.sh

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # story 3.17: a dangling Guard-cell name (a renamed/deleted
      # fn/test/case) fails in seconds, first, before paying for
      # rust-cache and a release cargo test -- the full run below still
      # covers everything this mode cannot see (the Rust suite itself,
      # the INV_ constant<->matrix symmetry).
      - run: bash ../scripts/ci/check-trace-matrix.sh --client-only
      # NFR50: the committed `*.proptest-regressions` files are tracked and
      # not ignored, so proptest replays them on every run.
      - run: bash ../scripts/ci/check-proptest-regressions.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - run: rustup toolchain install
      - name: property-test seed (reproduce a failure locally with this line)
        run: |
          echo "PROPTEST_CASES=$PROPTEST_CASES PROPTEST_RNG_SEED=$PROPTEST_RNG_SEED"
          echo "reproduce: PROPTEST_RNG_SEED=$PROPTEST_RNG_SEED PROPTEST_CASES=$PROPTEST_CASES cargo test -p <crate> --release -- <test>" | tee -a "$GITHUB_STEP_SUMMARY"
      # Story 3.7, Quentin's direction: the rule engine's own examples and
      # the scoping tests are cheap -- run them before the 4096-case
      # proptests so a broken evaluator fails in seconds.
      - name: the rule engine's examples and scoping tests, first
        run: cargo test -p sim --release --test rule_examples --test rule_scoping --test catchment_floor
      - name: native tests, including the property suite, in release
        run: cargo test --workspace --exclude browser_city --exclude sched_timing_spike --exclude boot_budget_spike --release
      - run: bash ../scripts/ci/check-trace-matrix.sh

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - run: rustup toolchain install
      - name: the module actually has to compile for the thing it runs on
        run: cargo build --target wasm32-unknown-unknown --release -p browser_city
      # FR163 (story 4.3): the dev-only clock reducers exist only behind
      # the `time-control` feature. The production build must not carry
      # them; the feature build must -- a sentinel nobody has proven present
      # guards nothing.
      - name: the time-control reducers are absent from the production module
        run: |
          wasm=target/wasm32-unknown-unknown/release/browser_city.wasm
          for s in jump_clock set_clock_speed; do
            if grep -aq "$s" "$wasm"; then echo "production module contains $s"; exit 1; fi
          done
      - name: the time-control flavour compiles and carries the reducers
        run: |
          cargo clippy --target wasm32-unknown-unknown -p browser_city --features time-control -- -D warnings
          cargo build --features time-control --target wasm32-unknown-unknown --release -p browser_city
          wasm=target/wasm32-unknown-unknown/release/browser_city.wasm
          for s in jump_clock set_clock_speed; do
            grep -aq "$s" "$wasm" || { echo "time-control module lacks $s"; exit 1; }
          done
      # A pin check that orders a re-run at the next version bump guards
      # nothing if the harness it points at has silently stopped
      # compiling since (Tim's direction) -- this is excluded from the
      # `test` job's `cargo test` (host-FFI symbols, cannot link
      # natively, same reason browser_city is excluded), so its only
      # compile check anywhere is here.
      - name: the timing spike's own module must still compile too
        run: cargo build --target wasm32-unknown-unknown --release -p sched_timing_spike
      - name: story 1.14's boot-budget spike module must still compile too
        run: cargo build --target wasm32-unknown-unknown --release -p boot_budget_spike

  migrate:
    name: migrate
    needs: [changes, build]
    # `needs: build` too, so a module that does not compile never spins up
    # an instance -- but this job's own gate is the `server` filter alone
    # (check-ci-gate.sh requires exactly one `needs.changes.outputs.*`
    # reference per job).
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: check-deploy-rehearsal.sh archives an older commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            server
            server/tests/fixtures
      - run: bash scripts/ci/install-spacetimedb-cli.sh "$RUNNER_TEMP/spacetimedb" >> "$GITHUB_PATH"
      # Story 1.4: scripts/ops/'s own fast, stub-`spacetime` tests --
      # never a real instance, but they build server/tools/world_backup
      # (cargo/rustup already set up in this job), so they run here
      # rather than in scripts-tests, which has neither. Runs before
      # either real-instance step below (Quentin's fail-fast direction):
      # a cheap, no-instance suite should fail before this job pays for
      # starting one, not after.
      - name: story 1.4, scripts/ops/'s own fast failure-path tests
        run: bash scripts/ops/tests/run-all.sh
      - name: story 1.2 AC3, proven against a real SpacetimeDB instance
        run: bash scripts/ci/check-live-migration.sh
      # Its own disposable local instance and port (3994), never 3987-3993.
      - name: a deploy onto a world whose init predates today's tables, rehearsed with deploy.yml's own post-publish steps
        run: bash scripts/ci/check-deploy-rehearsal.sh
      # Story 1.4: its own disposable local instance and port (3988),
      # never 3987 (check-live-migration.sh's) -- run in the same job
      # rather than a second one only because a module build is already
      # available here (Tim's direction), not because an instance is
      # shared between the two steps.
      - name: story 1.4 AC3/AC4, the restore proven against a real SpacetimeDB instance
        run: bash scripts/ci/check-backup-restore.sh
      # Story 2.8 (FR147): its own disposable local instance and port
      # (3989), never 3987/3988 (the two steps above's own) -- run in the
      # same job rather than a second one only because a module build is
      # already available here (the same reasoning check-backup-restore.sh
      # is here for), not because an instance is shared between the steps.
      - name: story 2.8 FR147, a view over a compiled-in constant re-evaluates on a live republish
        run: bash scripts/ci/check-view-live-refresh.sh
      # Story 4.2: its own disposable local instance and port (3991),
      # never 3987/3988/3989 (the three steps above's own) or 3990 (the
      # 1.3 timing spike's) -- same job, same reasoning as the two steps
      # above.
      - name: story 4.2, the authoritative loop fires with zero clients connected and survives a rebuild
        run: bash scripts/ci/check-authoritative-loop.sh
      # Story 4.3: its own disposable local instance and port (3992),
      # never 3987-3991 -- same job, same reasoning as the steps above.
      - name: story 4.3, the dev-only clock jumps, replays every skipped fire and runs the loop faster
        run: bash scripts/ci/check-time-control.sh
      # Story 4.12: its own disposable local instance and port (3993),
      # never 3987-3992 -- same job, same reasoning as the steps above.
      - name: story 4.12, the metrics sampler samples every table once per fire, and only the scheduler can call it
        run: bash scripts/ci/check-metrics-sampler.sh
      # Story 4.3: its own disposable local instance and port (3996),
      # never 3987-3995 -- same job, same reasoning as the steps above.
      - name: story 4.3 FR136, a chunk-equality subscription returns exactly its chunk, anonymously
        run: bash scripts/ci/check-interest-region.sh
      # Story 4.4: its own disposable local instance and port (3998), never
      # 3987-3997 -- same job, same reasoning as the steps above.
      - name: story 4.4 FR138, one durable position row per character, written only by its owner
        run: bash scripts/ci/check-player-position.sh
      # Story 4.5: its own disposable local instance and port (3997),
      # never 3987-3996 -- same job, same reasoning as the steps above.
      - name: story 4.5, identity create and link proven with real distinct identities
        run: bash scripts/ci/check-identity-link.sh

  coverage:
    name: coverage (sim)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Story 2.4's own proptests build a real WalkabilityGrid per case and
    # run erode/enclosed_regions/narrow_passages over it -- real work, not
    # the plain arithmetic most of this suite's other proptests do.
    # PROPTEST_CASES=4096 (the workflow-level default, calibrated for the
    # `test` job's own --release run) times that per-case cost, under
    # `cargo llvm-cov`'s unoptimized, instrumented build, blows this job's
    # 10-minute budget. A job-level env wins over the workflow-level one
    # for every step here; 256 (proptest's own upstream default) still
    # exercises every property thoroughly -- the `test` job's release-mode
    # run is what actually exhausts the input space at 4096.
    env:
      PROPTEST_CASES: 256
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - run: rustup toolchain install
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-llvm-cov@0.9.1
      # sim is pure, has no dependencies and is where the game logic will
      # live -- it has no excuse for an uncovered line. Scoped to sim only:
      # a repo-wide percentage gate only teaches people to write
      # assertion-free tests to pad it.
      - run: cargo llvm-cov -p sim --fail-under-lines 90

  client-check:
    name: client-check
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # The cargo-free half of check-trace-matrix.sh: the client inv_*
      # symmetry and the Guard-section path/name checks, at effectively
      # zero cost -- needs neither cargo nor node, so it runs first,
      # before setup-node/npm ci pay for the toolchain a dangling name
      # does not need (Tim's direction).
      - name: story 4.5 FR141, the identity token stays in identity-storage.ts and net/
        run: bash ../scripts/ci/check-identity-token-confined.sh
      - name: client-side trace-matrix symmetry (no cargo)
        run: bash ../scripts/ci/check-trace-matrix.sh --client-only
      - name: story 6.17 NFR50, no client property bypasses the one seed
        run: bash ../scripts/ci/check-client-property-seed.sh
      - name: story 15.18 NFR51, every client property explores the size it states
        run: bash ../scripts/ci/check-client-property-size.sh
      - name: story 15.7, every spec with a visual baseline is wired into update-visual-baselines.yml
        run: bash ../scripts/ci/check-visual-baseline-specs.sh
      - name: story 4.3 FR136, subscriptions are typed, per-chunk, and only issued from net/
        run: bash ../scripts/ci/check-subscription-shape.sh
      - name: scripted e2e walks go through one helper, with one release-lag bound
        run: bash ../scripts/ci/check-one-walk-helper.sh
      - name: story 5.1 FR63/NFR23, L3 reaches only itself and the defs types; net/ never reaches l3/
        run: bash ../scripts/ci/check-l3-boundary.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run lint
      - name: property-test seed (reproduce a failure locally with this line)
        run: |
          echo "FAST_CHECK_SEED=$FAST_CHECK_SEED"
          echo "reproduce: FAST_CHECK_SEED=$FAST_CHECK_SEED npx vitest run <test file>" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npm run test:unit:coverage
      - name: story 5.22 NFR49, no unit test takes over 30% of its own timeout under coverage
        if: success() || failure()
        run: bash ../scripts/ci/check-unit-test-durations.sh
      - run: rustup toolchain install
      # $GITHUB_PATH only takes effect from the *next* step onward, never
      # within the step that writes it -- so the CLI install and the check
      # that calls it cannot share one `run:` block.
      - run: bash ../scripts/ci/install-spacetimedb-cli.sh "$RUNNER_TEMP/spacetimedb" >> "$GITHUB_PATH"
      - name: bindings and protocol_version are exactly what the module generates
        run: bash ../scripts/ci/check-bindings-current.sh
      - name: story 2.8 FR147, the two protocol_version artefacts agree
        run: bash ../scripts/ci/check-protocol-version-agrees.sh
      - run: bash ../scripts/ci/check-no-shared-code.sh
      - name: the one client-side layer-rank mirror never drifts from the server golden
        run: bash ../scripts/ci/check-layer-table-current.sh
      - name: story 15.5 AC2, the renderer never names a defs/objects key
        run: bash ../scripts/ci/check-render-no-content-keys.sh
      - name: story 1.7 FR121, no masking/filter/render-texture construct under client/src/
        run: bash ../scripts/ci/check-no-masks.sh
      - name: story 15.6 NFR48, no position rounding under client/src/test-street/ outside snapToScreenPx
        run: bash ../scripts/ci/check-no-scene-rounding.sh
      - name: story 2.7, the Epic 1 raw character-part-sheet shortcut is gone, not bypassed
        run: bash ../scripts/ci/check-no-raw-part-sheets.sh
      - name: story 1.11 FR150/FR152/FR151, no canvas-text construct or native dialog under client/src/
        run: bash ../scripts/ci/check-no-canvas-ui.sh
      - name: story 1.9 FR148, the input layer cannot reach a procedure or an interaction module
        run: bash ../scripts/ci/check-input-boundary.sh
      - name: story 1.12 FR168, debug tooling is reachable only through main.ts's DEV-gated dynamic import
        run: bash ../scripts/ci/check-debug-boundary.sh
      - name: story 1.14, docs/spikes/1.14-boot-budget.md is exactly the generator's own output
        run: bash ../scripts/ci/check-boot-budget-report-current.sh
      - name: story 4.2 AC2, no reducer call under render/, world/ or test-street/, or inside any ticker.add callback
        run: bash ../scripts/ci/check-no-frame-rate-reducers.sh
      - name: story 4.4 FR138, one home for the player_position accessor and for the position reducer call
        run: bash ../scripts/ci/check-player-position-path.sh
      - name: story 4.4 NFR32, the client calls exactly the allow-listed reducers and procedures
        run: bash ../scripts/ci/check-client-write-allowlist.sh
      - name: story 4.4, remotePlayers appears only in the allow-listed specs
        run: bash ../scripts/ci/check-e2e-remote-players-isolation.sh

  client-build:
    name: client-build
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: the e2e test hook must not ship in the production bundle
        run: |
          if grep -rq '__bc' dist/assets/*.js; then
            echo "::error::window.__bc leaked into the production bundle -- import.meta.env.DEV did not strip it" >&2
            exit 1
          fi
      # Story 1.12 (AC1, Tim/Quentin's direction): the debug overlays are
      # behind a dynamic import inside a statically-false branch, so Rollup
      # should never emit their chunk at all -- a production build does not
      # contain them switched off, it does not contain them. These are the
      # sentinels that stay true to that: the markup markers the overlays
      # draw with and the module strings only they contain. Deliberately
      # NOT the palette hex values: PixiJS ships its own CSS colour table,
      # which contains `#ff00ff` (magenta/fuchsia), so grepping the palette
      # literals would fail on a build with no debug code in it whatsoever.
      - name: story 1.12 FR168, no debug overlay code reaches the production bundle
        run: |
          if grep -rlqE 'bc-debug|__bcDebug|data-bc-collider|data-bc-sort-label|no such overlay' dist/assets/*.js dist/index.html 2>/dev/null; then
            echo "::error::debug overlay code (client/src/debug/**) leaked into the production bundle -- the import.meta.env.DEV dynamic-import gate stopped working (FR168)" >&2
            exit 1
          fi
      # Story 4.5 (Tim's direction): the OIDC client is a lazily imported
      # chunk, loaded only when a link starts or the page boots back from the
      # provider -- the anonymous boot path pays zero bytes and zero requests
      # for it, so the entry chunk and index.html must not contain it.
      - name: story 4.5 FR143, the OIDC client stays out of the entry chunk and the boot path
        run: |
          if grep -lq 'signinRedirect' dist/assets/index-*.js; then
            echo "::error::oidc-client-ts reached the entry chunk -- client/src/identity/link-flow.ts must stay behind a dynamic import" >&2
            exit 1
          fi
          if grep -q 'link-flow' dist/index.html; then
            echo "::error::the link-flow chunk is preloaded by index.html -- it must load only when a link starts" >&2
            exit 1
          fi
          grep -lq 'signinRedirect' dist/assets/link-flow-*.js || { echo "::error::the link-flow chunk is missing or no longer carries the OIDC client" >&2; exit 1; }
      # Story 1.14 (Tim's direction): the decode-only harness and its
      # generated bindings live under tests/e2e/boot-budget/ precisely so
      # they are structurally unreachable from index.html's own module
      # graph; this is the regression guard for that staying true.
      - name: story 1.14, no boot-budget spike code reaches the production bundle
        run: |
          if grep -rlq 'boot-budget/bindings\|decode-harness\|boot_budget_spike' dist/assets/*.js dist/index.html 2>/dev/null; then
            echo "::error::boot-budget spike code (client/tests/e2e/boot-budget/**) leaked into the production bundle" >&2
            exit 1
          fi
      # Story 1.14 (NFR1): a fail-fast, browser-less regression gate for the
      # bundle term docs/spikes/1.14-boot-budget.md measured, set from that
      # spike's own number plus margin -- never a timing gate (that needs a
      # browser and stays out of the PR-blocking `ci` gate; see the trace
      # matrix's NFR1 row). Cycle 2 (Tim's direction): there is no matching
      # gzip gate on `dist/assets/*.png` -- PNG is already compressed, so
      # gzip-summing it measures nothing; the whole catalogue is not the
      # boot payload either, and a byte ceiling on all art gets bumped by
      # every art PR, which teaches everyone to bump budgets rather than
      # read them. The atlas term's own gate is deterministic and
      # request-shaped instead: `client/tests/e2e/boot-marks.spec.ts`'s
      # image-request-count/byte assertion, which runs on every client PR.
      - name: story 1.14 (NFR1), gzipped bundle size budget
        run: |
          BUNDLE_BUDGET_BYTES=180000

          bundle_bytes=0
          for f in dist/assets/index-*.js; do
            [ -f "$f" ] || continue
            sz=$(gzip -c "$f" | wc -c)
            bundle_bytes=$((bundle_bytes + sz))
          done
          if [ "$bundle_bytes" -eq 0 ]; then
            echo "::error::no dist/assets/index-*.js entry chunk found to measure" >&2
            exit 1
          fi
          if [ "$bundle_bytes" -gt "$BUNDLE_BUDGET_BYTES" ]; then
            echo "::error::production bundle grew to ${bundle_bytes} gzip bytes, over the ${BUNDLE_BUDGET_BYTES}-byte budget (docs/spikes/1.14-boot-budget.md) -- re-measure the spike if this is deliberate" >&2
            exit 1
          fi
          echo "bundle: ${bundle_bytes} gzip bytes (budget ${BUNDLE_BUDGET_BYTES})"
      # Quentin's direction: the asset is fetched at runtime, never
      # imported, so no other check in this PR would notice a Vite
      # publicDir/base-path change silently dropping it -- and it must
      # carry the exact version actually committed, not a stale one Vite
      # picked up from a cache.
      - name: story 2.1, the built defs asset exists and carries the committed defs_version
        run: |
          test -f dist/defs/defs.json || { echo "::error::dist/defs/defs.json is missing after npm run build" >&2; exit 1; }
          built=$(grep -oE '"defs_version": *"[^"]*"' dist/defs/defs.json | head -n1 | sed -E 's/.*"([^"]*)"$/\1/')
          committed=$(grep -oE '"defs_version": *"[^"]*"' public/defs/defs.json | head -n1 | sed -E 's/.*"([^"]*)"$/\1/')
          if [ "$built" != "$committed" ]; then
            echo "::error::dist/defs/defs.json's defs_version ($built) does not match the committed public/defs/defs.json ($committed)" >&2
            exit 1
          fi
      # The deploy story: a second, production-style build with the real
      # Pages base and dummy `wss://` VITE_ values -- catches a
      # misconfigured base or a client that would quietly dial localhost
      # (client/src/net/config.ts's dev fallback) on the PR, not on the
      # next master deploy. A separate --outDir so it never clobbers the
      # build above.
      - name: production-style build for GitHub Pages (real base, dummy production VITE_ values)
        run: |
          VITE_SPACETIME_URI=wss://dummy.invalid \
          VITE_SPACETIME_DB=dummy \
            npx vite build --base=/browser-city/ --outDir dist-pages
      - name: base path and production URI both check out
        run: bash ../scripts/ci/check-pages-bundle.sh dist-pages /browser-city/ wss://dummy.invalid

  # NFR49: the functional specs run as 4 Playwright shards, one runner and
  # one harness each (`workers: 1` stays inside a shard). About 8 minutes of
  # serial specs is about 2 per shard, leaving Epics 4-5 room to grow before
  # a shard's tests pass 6 minutes; then N goes up, never the timeout.
  # check-e2e-shards.sh pins N, `fail-fast: false` and the budgets.
  e2e:
    name: e2e (shard ${{ matrix.shard }}/4)
    needs: [changes, client-build]
    # Spans the boundary the other jobs don't -- runs whenever either half
    # changed, and is the slowest thing in the repo, so it must never be
    # what tells us a formatting error exists (client-check already did).
    # `client-build` is itself gated on `client` changing, so a server-only
    # change (where `e2e` is still 'true') leaves it `skipped`, not
    # `success` -- the default implicit "needs succeeded" would skip this
    # job too without the explicit result check below.
    if: |
      always() &&
      needs.changes.outputs.e2e == 'true' &&
      (needs.client-build.result == 'success' || needs.client-build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - run: rustup toolchain install
      # The shards only restore the shared `e2e` caches; `e2e-perf` saves
      # them (it builds both module flavours, a shard only one), so one
      # saver owns each key and the quota is not multiplied per runner.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
          shared-key: e2e
          save-if: false
      - run: bash scripts/ci/install-spacetimedb-cli.sh "$RUNNER_TEMP/spacetimedb" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - name: restore Playwright browsers, keyed to the pinned package version
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
      - working-directory: client
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - working-directory: client
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - working-directory: client
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      # Review evidence the e2e specs leave behind on every run, pass or
      # fail. The affordance grammar is a judgement call about what the
      # player sees, and a pixel count is no substitute for looking at it.
      # Each story's specs write to `review-shots/<story>/`; a new story
      # adds a directory, never a step. The `review-shots` job merges the
      # shards' artifacts back into one.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: review-shots-shard-${{ matrix.shard }}
          path: client/test-results/review-shots
          if-no-files-found: warn
          retention-days: 7
      # Every walk's record. Written outside `test-results`, which each
      # `playwright test` clears. `warn`: a shard's slice of the specs may
      # hold no walk.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: walk-records-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: client/walk-records
          if-no-files-found: warn
          retention-days: 7
      - name: worst overshoot per helper and segment
        if: always() && hashFiles('client/walk-records/walks.jsonl') != ''
        run: node scripts/ci/walk-records-summary.mjs client/walk-records/walks.jsonl >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            client/playwright-report/
            client/test-results/spacetime-start.log
          retention-days: 7

  # One artifact with `review-shots/<story>/` intact, as before sharding.
  review-shots:
    name: review-shots
    needs: [changes, e2e]
    if: always() && needs.changes.outputs.e2e == 'true' && needs.e2e.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-shots
          pattern: review-shots-shard-*
          delete-merged: true
          retention-days: 7

  # The deploy-smoke rehearsal and NFR2's perf gate, on their own runner
  # beside the shards: perf is steadier away from the functional specs.
  e2e-perf:
    name: e2e-perf
    needs: [changes, client-build]
    if: |
      always() &&
      needs.changes.outputs.e2e == 'true' &&
      (needs.client-build.result == 'success' || needs.client-build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - run: rustup toolchain install
      # The only saver of the shared `e2e` caches: it builds both module
      # flavours (production for the smoke rehearsal, time-control for
      # perf), a superset of what a shard builds.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
          shared-key: e2e
          save-if: true
      - run: bash scripts/ci/install-spacetimedb-cli.sh "$RUNNER_TEMP/spacetimedb" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - name: restore Playwright browsers, keyed to the pinned package version
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
      - working-directory: client
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - working-directory: client
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
      # The deploy story: the same client/tests/e2e/deploy-smoke.spec.ts
      # deploy.yml runs against the live URL, rehearsed here against a
      # production-base build (/browser-city/) served by `vite preview`,
      # backed by its own disposable local SpacetimeDB -- so a broken
      # smoke spec, or a base that only works at `/`, is caught before
      # merge rather than only after a real deploy.
      - name: post-deploy smoke spec, rehearsed against a production-base build
        working-directory: client
        run: node tests/e2e/serve-for-deploy-smoke.mjs
      # NFR2's regression gate (story 1.13): the same scripted walk on a
      # loop, gating p95/max frame *work* -- the whole per-frame CPU cost
      # (movement, re-sorting, visibility, the crowd's own update and
      # Pixi's own render, bracketed by ticker priority in
      # `test-street/scene.ts`), never a wall-clock frame rate, which on a
      # GPU-less headless runner would be noise and therefore flaky. The
      # full ten-minute soak is `perf-soak.yml`, deliberately not part of
      # this gate.
      - name: the frame path stays inside its work budget (NFR2, partial)
        working-directory: client
        run: npm run test:e2e:perf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: story-1.13-perf
          path: client/test-results/story-1.13-perf
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: walk-records-perf-${{ github.run_attempt }}
          path: client/walk-records
          if-no-files-found: error
          retention-days: 7
      - name: worst overshoot per helper and segment
        if: always()
        run: node scripts/ci/walk-records-summary.mjs client/walk-records/walks.jsonl >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-perf
          path: |
            client/playwright-report/
            client/test-results/spacetime-start.log
          retention-days: 7

  boot-smoke:
    name: boot-smoke
    needs: [changes, client-build]
    # Story 1.14, cycle 2 (Quentin's direction): boot-budget.yml (the full,
    # 400-page-load measurement) is workflow_dispatch-only and has never
    # run on Linux; the harness script has Windows-specific process
    # handling, so its first failure on a Linux runner would otherwise land
    # on master unnoticed. This proves the harness runs end to end on the
    # runner in a few minutes -- one cold sample, one row count -- only
    # when the harness itself changes.
    if: |
      always() &&
      needs.changes.outputs.bootbudget == 'true' &&
      (needs.client-build.result == 'success' || needs.client-build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - run: bash scripts/ci/install-spacetimedb-cli.sh "$RUNNER_TEMP/spacetimedb" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - working-directory: client
        run: npx playwright install --with-deps chromium
      - name: the harness itself runs end to end (one sample, one row count)
        env:
          BC_BOOT_SAMPLES: "1"
          BC_BOOT_DECODE_SAMPLES: "1"
          BC_BOOT_DECODE_ROW_COUNT: "7000"
          BC_BOOT_OUT_DIR: ${{ github.workspace }}/boot-smoke-out
          BC_BOOT_HOST_LABEL: github-actions-runner
        run: bash scripts/dev/run-boot-budget-spike.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: boot-smoke
          path: boot-smoke-out
          if-no-files-found: warn
          retention-days: 7

  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [changes, scripts-tests, defs, check, test, build, migrate, coverage, client-check, client-build, e2e, review-shots, e2e-perf, boot-smoke]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      # A job that is `skipped` is not automatically a failure here: it is
      # only correct if the `changes` filter that gates it says the paths
      # it cares about did not change. See that script for why this lives
      # here rather than as an inline expression.
      - run: |
          bash scripts/ci/check-ci-gate.sh \
            '${{ toJSON(needs) }}' \
            '${{ toJSON(needs.changes.outputs) }}'
