name: windows-install-check

# The Windows CLI install method in server/README.md, run verbatim on a
# clean windows-latest runner, so drift in the upstream installer or in
# our version pin shows up on its own -- see that README section.
on:
  push:
    branches: [master]
    paths:
      - server/README.md
      - scripts/ci/extract-windows-install.sh
      - .github/workflows/windows-install-check.yml
  pull_request:
    paths:
      - server/README.md
      - scripts/ci/extract-windows-install.sh
      - .github/workflows/windows-install-check.yml
  schedule:
    # Its real failure mode is upstream drift, not our own commits.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  windows-install:
    name: windows-install
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: extract the README's Windows install block
        shell: bash
        run: bash scripts/ci/extract-windows-install.sh server/README.md > "$RUNNER_TEMP/install.ps1"
      - name: run it verbatim
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\install.ps1"
      - name: assert the pinned version is what actually got installed
        shell: pwsh
        run: |
          $out = spacetime --version
          Write-Host $out
          if ($out -notmatch "2\.9\.\d+") {
            Write-Error "expected spacetime --version to report 2.9.x, got: $out"
            exit 1
          }
