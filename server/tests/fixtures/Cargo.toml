[workspace]
members = ["migration_v1", "migration_v2_good", "migration_v2_bad", "view_v1", "view_v2"]
resolver = "2"

# One lockfile for all fixtures (story 1.2 review): the migration_* trio is
# only ever meaningful as "v1 plus one column" pairs, and three copied
# lockfiles guarding one column each invited exactly the silent drift
# check-live-migration.sh exists to catch -- view_v1/view_v2 (story 2.8,
# check-view-live-refresh.sh) are the same "identical schema, one constant
# differs" pairing and share the reasoning. A standalone workspace (not a
# member of ../../Cargo.toml, which excludes this whole directory) so
# `cargo test --workspace` at the module root never touches it.
