[package]
name = "sim"
version = "0.1.0"
edition = "2024"

# Pure simulation crate: NFR28. Never add spacetimedb, tokio, or any
# network/filesystem/time/random dependency here -- `check-sim-purity.sh`
# fails the build if one shows up in this crate's dependency graph.

[features]
# Gates sim::world::fixture (hand-authored test geometry, story 1.5): off
# by default so `browser_city` (which depends on this crate with default
# features, never this one) never compiles it into the published wasm
# module. `bounds` turns it on for its own dependency below; the
# self-referential dev-dependency turns it on for `cargo test -p sim`
# without a flag, the same trick that keeps a `#[cfg(test)]`-only item
# reachable from this crate's own `tests/` (which link the library built
# for `[dependencies]`, not for `[dev-dependencies]`).
#
# Named `test-fixtures`, never `fixture` (story 2.9, Crew's decision): the
# taxonomy's own `fixture` role tag key would otherwise appear as a
# quoted literal under `server/sim/src/rules/` (this feature's own
# `#[cfg(feature = "fixture")]`) and trip `check-rule-engine-no-content-
# keys.sh`'s own AC3 guard -- a genuine collision between an unrelated
# Cargo feature name and a manifest key, not a false positive the guard
# should special-case.
test-fixtures = []

[dependencies]

[dev-dependencies]
proptest = "=1.11.0"
sim = { path = ".", features = ["test-fixtures"] }
