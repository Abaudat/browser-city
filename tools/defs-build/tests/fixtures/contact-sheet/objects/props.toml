# Story 2.5: a small, dedicated fixture tree for the contact sheet's own
# golden test -- never `tests/fixtures/valid/`, whose own goldens (the
# emit/manifest/atlas-determinism suites) must not churn on a fixture
# added for a different story. Four objects, each exercising one thing
# this sheet must draw correctly: a bespoke (no archetype) prop with an
# off-origin collider and an overspilling `interact_at`; two objects
# sharing one archetype (grouping); a walk-through prop with no collider.

