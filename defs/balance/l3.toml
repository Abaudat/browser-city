# L3 bodies (FR63, FR64, NFR23, story 5.1): client-side micro pathing, pace
# and gait for instantiated citizens. Time is authoritative; these dials
# describe what a leg issued to L3 should look like, never a clamp on it.

[[balance]]
# A leg whose required pace is outside canonical walking speed +/- this
# percentage is a defect in whoever issued the leg.
key = "l3.walk_pace_band_percent"
value = 15
min = 1
max = 50

[[balance]]
# The longest a body may stand still between depart and arrive, in real ms.
key = "l3.stall_bound_ms"
value = 250
min = 1
max = 5000

[[balance]]
# A body is never at its destination earlier than this many milliminutes
# before the leg's arrival instant.
key = "l3.early_arrival_bound_milliminutes"
value = 0
min = 0
max = 1000

[[balance]]
# A leg's micro-path search is bounded to its two waypoints' bounding box
# inflated by this many cells.
key = "l3.path_box_margin_cells"
value = 6
min = 1
max = 64

[[balance]]
# Node expansions one micro-path search may spend before the leg is walked
# as a straight segment.
key = "l3.path_node_budget"
value = 4096
min = 64
max = 1000000

[[balance]]
# A micro-path search box larger than this many cells is refused (a typed
# failure, the leg is walked straight) before anything is allocated.
key = "l3.path_max_cells"
value = 65536
min = 64
max = 16777216

# Story 5.2 (FR64, FR65, NFR26): local avoidance and flavour. Both are draw
# only: a pure function of ledger poses, ids and city time.

[[balance]]
# Two bodies closer than this (millicells) step around each other; the
# sidestep is zero at this distance and grows smoothly as they close.
key = "l3.avoid_radius_millicells"
value = 1500
min = 500
max = 8000

[[balance]]
# The largest sidestep of one body from its ledger pose, in millicells. Under
# half a cell, so a body never leaves its tile's neighbourhood.
key = "l3.avoid_max_offset_millicells"
value = 450
min = 0
max = 499

[[balance]]
# Neighbours one body steps around at once; any more are ignored, in a fixed
# order every client shares.
key = "l3.avoid_max_neighbours"
value = 16
min = 1
max = 256

[[balance]]
# A standing citizen resolves one flavour draw per bucket this long
# (milliminutes), its boundaries shifted by an offset from its id.
key = "l3.flavour_bucket_milliminutes"
value = 10000
min = 400
max = 100000

[[balance]]
# The share of buckets that resolve to a glance; the rest resolve to nothing.
key = "l3.flavour_glance_percent"
value = 25
min = 0
max = 100

[[balance]]
# How long a glance lasts, in milliminutes; it always fits inside its bucket.
key = "l3.flavour_glance_milliminutes"
value = 1200
min = 40
max = 20000

[[balance]]
# How long each frame of the idle row shows, in milliminutes.
key = "l3.idle_frame_milliminutes"
value = 80
min = 4
max = 2000
