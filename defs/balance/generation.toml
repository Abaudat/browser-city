value = 7
min = 0
max = 100

[[balance]]
# Absolute percentage points a non-residential use's realised area share
# may sit from its own `share_*_pct` key -- the pass-1 wild-deviation
# guard. The overshoot side is bounded by construction (`land_use::
# takes_leaf` overshoots by at most half a leaf: half of `max_leaf_cells`
