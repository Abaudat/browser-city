[[balance]]
# The four `share_*_pct` keys sum to 100 -- checked by
# `GenerationConfig::from_balance`, not trusted from authoring. Story
# 4.21 retuned residential/institutional 58/10 -> 61/7 with the move to
# area shares: institutional grows from the smallest leaves, so its
