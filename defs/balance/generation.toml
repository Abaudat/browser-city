[[balance]]
# The site-scale-free long-range detour claim 3.11's pathfinding
# estimator relies on (story 15.10, Derek's direction): `network <=
# max(manhattan + max_detour_excess_cells, manhattan * max_detour_
# percent / 100)`, for every sampled pair -- a short hop pays at most a
# fixed cell budget (a single jitter-driven jog), a long crossing pays
# at most a ratio, and there is no third, separately committed distance
# threshold deciding which applies (`GenerationConfig::detour_ratio_
# takeover_distance_cells` derives where the ratio term actually
# overtakes the excess one: `max_detour_excess_cells * 100 /
# (max_detour_percent - 100)`, 416 cells today). Story 3.18's own
# `detour_long_pair_cells` is gone: no value of a separate threshold key
# could make an AND-with-threshold contract both non-redundant (short of
# the takeover distance, the ratio was already implied by the excess
# bound) and coherent (a pair a few cells past the threshold was
# suddenly allowed *less* excess than a pair a few cells short of it --
# the seam seed `8872365549107643721` walked into, CI run 36388555866,
# PR #349). Re-measured with real margin at the real (unmeasured, since
# 3.11) long range: over the harness's own 50,000-seed exhaustive loop,
# the worst ratio among pairs at or beyond the takeover distance was
# 176% at `GENERATION_VERSION` 9 (seed `4595557621078204092`); 200 is
# that plus real margin --
# re-measure by running `cargo run -p bounds --release --bin measure-
# generation`'s own detour-bounds sweep whenever the street algorithm
# changes, never "re-run the invariants at a high PROPTEST_CASES" (a
# proptest run only ever samples the cheap 14-node width). Zero misses
# against the max()-contract over
# 1,000,000 seeds follows from `max_detour_excess_cells`'s own sweep
# (below): exceeding the max() of two terms means exceeding both, so a
# contract violation is always also an excess-alone violation, and that
# ceiling's own miss count is already 0 (`inv_generation_detour_ratio_
# bounded`'s own doc comment carries the proof; `docs/generation.md`'s
# street-network pass carries the full sweep output). `min` is 101, not
# 100 (Tim's/Quentin's direction, story 15.10 cycle 2): at or under 100
# the ratio term (`manhattan * max_detour_percent / 100`) is never
# looser than the excess term, so `detour_ratio_takeover_distance_cells`'s
# own division (`max_detour_excess_cells * 100 / (max_detour_percent -
# 100)`) is either undefined (100) or negative (under 100) --
# `from_balance` refuses it independently too, so this `min` and that
# refusal must always agree.
key = "generation.streets.max_detour_percent"
value = 200
min = 101
max = 500

[[balance]]
# The additive Manhattan-fitness ceiling, in world cells: `inv_
# generation_detour_ratio_bounded` checks every one of its own sampled
# pairs against this, regardless of distance -- what a short hop
# actually pays for, where a ratio is dominated by a single jitter-
# driven jog. The *value itself* is a measurement, not derived from that
# same cheap sample (this generator has no tight structural bound to
# derive one from -- see `docs/generation.md`'s street-network pass for
# why): re-derived by `cargo run -p bounds --release --bin measure-
# generation`. Margin rule: the exhaustive-pair max (every non-both-
# boundary node pair, not the cheap `DETOUR_SAMPLE_MAX_NODES` sample
# the required property above checks) over the harness's own 50,000
# mixed seeds, times 1.25, rounded up to a multiple of 8. Measured at
# `GENERATION_VERSION` 9 (story 4.22): exhaustive max 320, at seed
# `610140160610395379` -- 320 * 1.25 = 400 (already a multiple of 8).
# `from_balance` separately refuses a value
# over `4 * block_size_max_cells + 2 * arterial_width_cells` (504 at
# this generator's other committed values) -- a loosening guard, never
# a worst-case claim (`GenerationConfig::from_balance`'s own comment).
# `610140160610395379`, `4595557621078204092` and
# `6482608135473407511` are pinned, each against its own exhaustive
# excess, in `streets::PINNED_DETOUR_SEEDS` (`invariants.rs`'s own
# `detour_excess_holds_at_pinned_boundary_exit_seeds`). Miss rate
# measured directly (story 15.10, `measure-generation`'s own detour-
# bounds sweep, 1,000,000 seeds, passes 1-2 only): 0 misses against
# this ceiling at the cheap 14-node sample -- see `max_detour_percent`'s
# own comment for the rule-of-three bound that figure implies.
key = "generation.streets.max_detour_excess_cells"
value = 400
min = 1
max = 2048

[[balance]]
# The 99th-percentile detour ratio, over one city's own sampled pairs,
# must not exceed this -- `max_detour_percent` alone only bounds the
# single worst pair. Sampled separately, over more pairs than the max/
# excess bounds (DETOUR_P99_SAMPLE_MAX_NODES): a percentile over too few
# pairs is just the maximum under another name (Tim's direction, cycle
# 3). Measured worst case, same scan, 10,000 seeds: 175%; 200 is that
