# Story 3.2 (FR110 passes 1-2, NFR8): land use and the street network.
# Every number here is a starting value, settled against
# `docs/generation/*.svg` (`bounds`'s `dump-generation` binary), not a
# literal in `server/sim/src/generation/`. `docs/generation.md`'s
# `## parameters` table carries each key's intent.

# --- land use (pass 1) -----------------------------------------------

[[balance]]
# World cells per coarse land-use cell. `generation.site_extent_cells`
# must be a whole multiple of this (`GenerationConfig::from_balance`
# rejects a mismatch) -- never `world::CHUNK_SIZE`, a subscription unit
# and a zoning unit are unrelated.
key = "generation.land_use.coarse_cell_size_cells"
value = 16
min = 1
max = 128

[[balance]]
# The site's own square extent, in world cells. 512 is never a literal
# anywhere in `sim::generation`.
key = "generation.site_extent_cells"
value = 512
min = 64
max = 2048

[[balance]]
# Every district (recursive-subdivision leaf) is at least this many
# coarse cells on both axes -- the guaranteed lower bound on a region's
# own area (`land_use::guaranteed_min_region_cells`), since a leaf can
# only grow when merged with an adjacent same-use leaf, never shrink.
# Lowered from 4 (Artie's direction, cycle 3): institutional needs
# several small, non-adjacent pockets under roughly 2.5% of the site
# each, which the raw leaf pool at the old 4/10 min/max was too coarse
# to reliably supply (a single leaf at the old max alone was already
# ~10% of the site) -- finer land-use grain overall is what makes a
# small pocket a small leaf, rather than the smallest of a handful of
# large ones.
key = "generation.land_use.min_leaf_cells"
value = 3
min = 1
max = 64

[[balance]]
# A leaf larger than this on either axis is split again. Must be at
# least twice `min_leaf_cells` (`GenerationConfig::from_balance` rejects
# a smaller value) -- otherwise an over-sized axis could be too narrow to
# legally split in two while keeping both children at least `min_leaf_
# cells`.
key = "generation.land_use.max_leaf_cells"
value = 6
min = 2
max = 128

[[balance]]
# How far a district split position may jitter from the rect's own
# midpoint, as a percent of the rect's own length on the split axis.
key = "generation.land_use.split_jitter_pct"
value = 30
min = 0
max = 45

[[balance]]
# A termination cap on recursive subdivision depth -- generation is
# total, so a pathological config still terminates rather than looping.
# It must never be what sizes a leaf: at the committed 32x32 coarse grid
# a 32-cell axis needs about four levels per axis, and a cap of 8 bound
# and left leaves over `max_leaf_cells` (`subdivide_never_produces_a_leaf_
# over_the_maximum_on_either_axis` guards it).
key = "generation.land_use.max_recursion_depth"
value = 20
min = 1
max = 20

[[balance]]
# Density at the site's own edge (Chebyshev distance from centre at its
