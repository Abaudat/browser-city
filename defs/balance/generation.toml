# arbitrary-seed failure is a roughly four-in-a-hundred-million event
# (two-sided) rather than a number tuned to the observed sample's own
# min/max. Measured over 50,000 seeds (`cargo run -p bounds --release
# --bin measure-generation`): mean 910, standard deviation 29.9, min 777,
# max 1,048. 5.5 * 29.9 / 894 = 18.4%; 21 clears it with real margin, and
# covers the measured min (894-777=117, 13.1%) and max (1048-894=154,
# 17.2%). Re-derived from the harness's own sigma after every retune.
key = "generation.envelopes.count_tolerance_percent"
value = 21
min = 1
max = 100

[[balance]]
# AC4's pooled half: the mean placed count over the fixed seed range
# `0..256` must sit within this percent of the scaled target (`server/
# sim/tests/invariants.rs`'s `inv_generation_building_count_mean_matches_
# the_scale_baseline`) -- the assertion that actually tests the target,
# never merged with the per-seed wild-deviation band above.
key = "generation.envelopes.mean_count_tolerance_percent"
value = 3
min = 0
max = 100

[[balance]]
# Rejection rate gets its own key, asserted per city -- without it a
# generator that rejects half the district still passes every other
# property until AC4 catches it for the wrong reason. Measured over the
# same 50,000-seed scan: zero rejections in 50,000 cities -- `plots::run`
# never hands pass 4 a plot it cannot build (row depth clears the class
# minimum plus setback; a corner plot is cut wider by the inset its
# corner edge carries), so `Rejected` is reachable only from a hand-built
# fixture. 1 is the ceiling a single real rejection would already breach
# in any city under 100 plots.
key = "generation.envelopes.max_rejected_plot_percent"
value = 1
min = 0
max = 100

