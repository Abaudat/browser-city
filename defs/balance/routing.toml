# In-city travel-time estimator (FR131, story 3.11). Transport modes are
# multipliers on the one canonical walking speed,
# `movement.walk_speed_millicells_per_s`, never absolute speeds -- walking
# is pinned at exactly 100 so the ladder is always relative to it.

[[balance]]
key = "routing.speed_percent.walk"
value = 100
min = 100
max = 100

[[balance]]
key = "routing.speed_percent.bike"
value = 200
min = 100
max = 500

[[balance]]
key = "routing.speed_percent.transit"
value = 300
min = 100
max = 500

[[balance]]
# Charged once per floor of |floor difference| between the two endpoints.
key = "routing.floor_change_penalty_milliminutes"
value = 1000
min = 0
max = 600000

[[balance]]
# Macro routing graph (story 3.9, FR134): a building whose interior net
# floor area is at or over this many cells gets an internal node beyond
# its entrance node.
key = "routing.graph.internal_node_min_interior_cells"
value = 100
min = 1
max = 100000

[[balance]]
# Route search (story 3.12, FR131): the most nodes one search may expand
# before it is refused. Sized from the largest generated district, 1024
# cells a side: `max_nodes_for_side(1024)` = 9,620 nodes, a search expands
# at most all of them, plus 25% headroom.
key = "routing.search.node_budget"
value = 12000
min = 1000
max = 100000

[[balance]]
# Provision query (story 3.10, FR130, FR131): how far, as the estimate
# from the asking point in the asker's own mode, the city looks for a
# provision. Minutes, never cells: a faster mode widens the same radius.
key = "routing.provision.query_radius_minutes"
value = 15
min = 1
max = 18

[[balance]]
# Provision query (story 3.10): the most hits one query returns, nearest by
# estimate first. A cut by locality, not a performance guard: in a dense
# core the nearest few hide a better place further out, which is the design
# ("the local cafe tends to win"); do not halve it to save time.
key = "routing.provision.max_results"
value = 16
min = 1
max = 1000
