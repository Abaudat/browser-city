# FR123/FR124 rendering constants (story 1.6). Both are content data, not
# TypeScript literals, so they fold into `defs_version` and stay reviewable
# alongside the art -- see docs/architecture.md's "Rendering" section.

[[balance]]
# The LimeZu sheets this project draws from are native 16x16 pixel art
# (docs/gdd.md); every world-space-to-screen-space conversion multiplies
# by this before the 3x zoom scale.
key = "render.tile_size_px"
value = 16
min = 1
max = 64

[[balance]]
# One storey's vertical screen offset (FR124): stacking a LimeZu interior
# wall module (ModernTileset/moderninteriors-win/1_Interiors/16x16/
# Room_Builder_subfiles/Room_Builder_Walls_16x16.png) three tiles tall
# lands the upper storey's floor line exactly on the lower storey's wall
# top, with no seam and no double baseboard -- verified visually in the
# story 1.6 demo scene screenshots. 3 tiles * 16px.
key = "render.storey_height_px"
value = 48
min = 1
max = 256

[[balance]]
# FR121: a window wall tile's alpha, drawn from outside -- strictly
# between 0 and 1 (never a literal in `render/visibility.ts` or
# `pixi-visibility.ts`) so the furniture behind the glass is visible but
# the wall still reads as glazed, not as a hole. Artie's starting value,
# tuned by eye against the story 1.7 demo terrace screenshots.
key = "render.window_alpha"
value = 50
min = 1
max = 99

[[balance]]
# FR173: the ceiling `render/highlight.ts`'s `highlightOverlayAlpha` scales
# by the U1 display-strength dial (`settings/display-settings.ts`,
# `[20, 100]`, default 60) -- a percent integer (never a TypeScript
# literal), divided down to a plain `(0, 1)` fraction in `main.ts` the same
# way `render.window_alpha` is. Settled by playing (Artie's direction,
# cycle 2): judged on full-viewport screenshots of the densest street the
# test scene produces, unmarked against marked, at the default dial and at
# the floor, against both a dark prop (the trash bin) and a pale one (the
# shop counter) -- 18% (the first value tried) measured as a mean ~5%
# brighten at the default dial and did not read reliably even zoomed in
# with the object already known; 50% puts the default dial's own effective
# alpha at 30%, which does.
key = "render.highlight_alpha"
value = 50
min = 1
max = 100

