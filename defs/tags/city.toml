# Story 2.10 (FR111): the rule engine's own vocabulary. A tag is declared
# here, once, and referenced by an object's `tags` field or by a
# `defs/rules/*.toml` row -- never a literal object/def key past this
# file. Permanent ids, append-only (`tools/defs-build/goldens/defs-
# manifest.golden`), exactly like every other def kind.
[[tag]]
id = 1
key = "waste"

[[tag]]
id = 2
key = "seating"

[[tag]]
id = 3
key = "counter"

[[tag]]
id = 4
key = "lighting"

[[tag]]
id = 5
key = "shopfront"

[[tag]]
id = 6
key = "wall"
# Story 2.9 (AC1, FR119): a role tag's own payload -- the closed list of
# layer names an object of this role may sit on. `id`/`key` are
# untouched (the append-only manifest guard covers those two alone), so
# adding this table to an existing tag is not a renumbering.
role = { layers = ["walls"] }

[[tag]]
id = 7
key = "bridge"

[[tag]]
id = 8
key = "stairs"

# Story 2.4 (FR128): the walkability invariant's own vocabulary -- an
# object with no `collider` must carry this tag (it is explicitly walked
# on, like a manhole cover, a rug, a doormat or a floor decal), and an
# object that carries this tag must never also declare a `collider`. Not
# an allow-list of object keys: any object may carry it, reviewed the
# same way as every other content change, in this file's own diff.
[[tag]]
id = 9
key = "underfoot"

# Story 2.9 (AC3, FR119): the wall-closure primitive's own vocabulary --
# an ordinary tag, never a role, carried by both `wall` and `threshold`
# objects. A threshold interrupts the `wall` role but not a wall run: the
# closure row (`defs/rules/grammar.toml`) counts either as a run
# neighbour, so a doorway's own jambs are never free-standing stubs.
[[tag]]
id = 16
key = "wall_run"

# Marks a `threshold` that opens onto the exterior (pavement or road),
# distinguishing a building's own street door from an interior door
# between two rooms -- the building-level completeness primitive
# (`defs/rules/grammar.toml`) asks for an area containing `wall` to hold
# at least one of these, never an interior-only threshold.
[[tag]]
id = 17
key = "entrance"
