# Story 3.5 (FR110/FR112): the interior-layout pass's own vocabulary.
# Every tag here is a plain tag the rule engine already speaks -- none is
# an object, none names a sprite (which sprite dresses a room is the
# theme pass's, 3.7). A room type carries `room`, exactly one access tag
# and the one function tag its anchors hang on; an anchor tag is what a
# `[[requirement]]` row in `defs/rules/interiors.toml` demands of a room
# carrying that function tag.

# Access: exactly one per room type (`tools/defs-build` enforces it).
# `staff` is what "back room" means; keys, opening hours and the guard's
# door round read these later.
[[tag]]
id = 36
key = "public"

[[tag]]
id = 37
key = "staff"

[[tag]]
id = 38
key = "private"

# Carried by every room type: the container "every room has a light"
# is stated over.
[[tag]]
id = 39
key = "room"

# Function tags: what a room is for, hence which anchors it owes.
[[tag]]
id = 40
key = "sleeping"

[[tag]]
id = 41
key = "cooking"

[[tag]]
id = 42
key = "washing"

[[tag]]
id = 43
key = "dining"

[[tag]]
id = 44
key = "trading"

[[tag]]
id = 45
key = "seated_service"

[[tag]]
id = 46
key = "working"

[[tag]]
id = 47
key = "making"

# Anchor fixtures: a citizen acts at each of these to meet a need or hold
# a post. `stock` is an empty container -- no item, no quantity. Each
# carries the placement class the layout pass stands it by.
[[tag]]
id = 48
key = "stock"
placement = "wall_backed"

[[tag]]
id = 49
key = "bed"
placement = "wall_backed"

[[tag]]
id = 50
key = "cooker"
placement = "wall_backed"

[[tag]]
id = 51
key = "basin"
placement = "wall_backed"

[[tag]]
id = 52
key = "table_set"
placement = "free_standing"

[[tag]]
id = 53
key = "desk"
placement = "wall_backed"

[[tag]]
id = 54
key = "workbench"
placement = "wall_backed"

# Story 3.6 (FR110): the prop pass's own vocabulary. Every object def a
# prop pass may place carries exactly one of `indoor` / `outdoor` --
# which side of the door its sprite family belongs to -- and the pass
# reads the two `[[coherence]]` rows over them (`defs/rules/props.toml`)
# to know where each may stand, never a sheet path or an object key.
[[tag]]
id = 55
key = "indoor"

[[tag]]
id = 56
key = "outdoor"

# Dressing a room owes by its function tag, stood like every other owed
# fixture by its own placement class (the debt story 3.5 recorded).
[[tag]]
id = 57
key = "toilet"
placement = "wall_backed"

# What a street lamp is, so the street's lighting row is stated over the
# lamps of the street alone, never over a room's own light.
[[tag]]
id = 58
key = "street_light"

# A cell of the street's own pavement -- never a building's doorstep, which
# also carries `pavement` -- so the street's lighting row is stated over
# the street alone. Pass 7 stamps it on every cell of pavement its street
# grid holds.
[[tag]]
id = 59
key = "footway"

# A seat drawn at a table. Not a room's anchor: pass 7 stands one beside each
# table set it places, as the requirement row over `table_set` asks.
[[tag]]
id = 60
key = "chair"

# A table drawn with seats: the round tables, never the stool. Pass 7 stands
# chairs beside each one, as the distribution rows over it ask.
[[tag]]
id = 61
key = "seated_table"
