# Story 3.5 (FR110): the room grammar's vocabulary -- a small shared set
# a building type's program (`defs/building-types/*.toml`'s `rooms` and
# `optional_rooms`) is composed from, never one room type per building
# type. A row is its tags, the smallest floor it may be laid out on (two
# walkable cells either way: no room narrower than that) and a weight
# (its share of the spare width beside its neighbours) -- nothing else.
# What a room owes (a light, a bed, a stock shelf) is a `[[requirement]]`
# row over one of its tags (`defs/rules/interiors.toml`), never a field
# here. Access (`public`/`staff`/`private`) is exactly one tag per room.

[[room_type]]
id = 1
key = "living_room"
tags = ["room", "private", "dining"]
min_width_cells = 3
min_depth_cells = 2
weight = 3

