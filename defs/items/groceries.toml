# footprint the cupboard's grid is tuned against. A sprite is the thing
# alone (never a stand, tray or shelf with the thing on it) and exactly
# `bulk * tile` pixels, so the item in the cupboard is the item on the
# pavement. Shelf lives are starting values: fruit spoils in days, the rest
# keeps.

