# Story 2.6 (Artie's direction): maps a theme-sorter-derived theme
# (tools/defs-build's own theme_group -- the folder segment, normalised)
# to the atlas page group it actually shares. A theme with no row here
# is a build error naming it -- there is no silent per-theme-folder
# default.
#
# Every theme a real street kit's single props borrow art from, plus the
# always-present terrain/building themes, share one "street" group so a
# street scene binds a small, fixed page set regardless of how many
# themes its individual props happen to come from -- one page set per
# theme folder would otherwise put every new prop on yet another bound
# page (NFR12). A themed district (a hospital, a school interior) keeps
# its own group instead, added here the day its own objects land.

[[page_group]]
theme = "terrains_and_fences"
group = "street"

[[page_group]]
theme = "city_terrains"
group = "street"

[[page_group]]
theme = "city_props"
group = "street"

[[page_group]]
theme = "generic_building"
group = "street"

[[page_group]]
theme = "floor_modular_building"
group = "street"

[[page_group]]
theme = "camping"
group = "street"

[[page_group]]
theme = "school"
group = "street"

[[page_group]]
theme = "beach"
group = "street"

[[page_group]]
theme = "office"
group = "street"

[[page_group]]
theme = "garden"
group = "street"

[[page_group]]
theme = "vehicles"
group = "street"
