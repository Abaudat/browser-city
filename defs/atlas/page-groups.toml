# Story 2.6 (Artie's direction): maps a theme-sorter-derived theme
# (tools/defs-build's own theme_group -- the folder segment, normalised)
# to the atlas page group it actually shares. A theme with no row here
# is a build error naming it -- there is no silent per-theme-folder
# default.
#
# Every theme drawn in any scene -- the street kit's terrain, buildings
# and borrowed props, and the interior shell (`room_builder`: floors,
# walls, thresholds every scene draws) -- shares one "shared" group, so a
# scene binds a small, fixed page set (NFR12). A themed district (a
# hospital, a school interior) keeps its own group instead, added here
# the day its own objects land.

[[page_group]]
theme = "terrains_and_fences"
group = "shared"

[[page_group]]
theme = "city_terrains"
group = "shared"

[[page_group]]
theme = "city_props"
group = "shared"

[[page_group]]
theme = "generic_building"
group = "shared"

[[page_group]]
theme = "floor_modular_building"
group = "shared"

[[page_group]]
theme = "camping"
group = "shared"

[[page_group]]
theme = "school"
group = "shared"

[[page_group]]
theme = "beach"
group = "shared"

[[page_group]]
theme = "office"
group = "shared"

[[page_group]]
