# Story 3.4 (FR116). `depot`'s `weight = 0`: it is never drawn by the
# ordinary weighted fill (`sim::generation::building_types::run`'s own
# fill step never picks a zero-weight type) -- it exists on industrial
# land only where the `depot_present` distribution row
# (defs/rules/generation.toml) places it, keeping its own placed count
# exactly the row's own target, never inflated by an unrelated fill
# draw. `bottling_plant`/`recycling_facility` are the plastic-bottle
# reference chain's own future industrial end (`defs/chains/
# sanitation.toml`'s own `plastic_bottle` chain, `sanitation_worker`
# link) -- named now so the job stories have a workplace to attach the
# loop to, no chain wiring here (Derek's direction).

