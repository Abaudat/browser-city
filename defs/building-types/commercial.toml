# Story 3.4 (FR116): commercial-land workplace variety (Derek's
# assumption B: a small set of generic types, never one type repeated;
# Derek's cycle-1 direction: real variety, 2-4 posts per type, common
# professions shared across types so they clear 5+ employers naturally).
# `general_retail`/`cafe` cover the full density and site-context range
# as the safety net every other, narrower row can lean on --
# `check_building_type_density_coverage` (`tools/defs-build`) holds this
# for real rather than trusting it.

