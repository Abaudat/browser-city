id = 5
key = "general_retail"
rooms = ["shop_floor", "stock_room"]
optional_rooms = ["office", "stock_room"]
tags = ["shop"]
land_uses = ["commercial"]
density_min = 0
density_max = 100
min_interior_width_cells = 6
min_interior_depth_cells = 6
weight = 20
professions = ["shop_clerk", "cashier"]

