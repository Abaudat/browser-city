# A shuttered shopfront is content in this game, not a gap (Derek's
# direction, PR #317 cycle 2): the one lever that brings the workplace-
# count pooled mean down to the Scale Baseline target without inflating
# any one workplace type's own weight -- no `professions`, so it is
# never a workplace at all.
