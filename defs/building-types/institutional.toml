# Story 3.4 (FR116). `council`/`hospital`/`welfare_office`/`shelter` all
# carry `weight = 0` (see `industrial.toml`'s own comment on `depot`):
# each is placed exclusively by its own distribution row
# (defs/rules/generation.toml), never by the ordinary weighted fill.
# `school`/`clinic`/`library`/`police_station`/`fire_station`/`transit_
# office` are the institutional-land fill -- real civic variety (Derek's
# direction, PR #317 cycle 1), replacing the earlier single generic
# filler.
#
# None of the four singleton rows restricts its own density band: `land_
# use::assign_institutional`'s own placement never guarantees an
# institutional pocket reaches any particular density band for every
# seed (pockets are sited for spacing, not for density), so pairing a
# density restriction with a `weight = 0`, distribution-only type made a
# structurally-unplaceable seed a real generation failure for a
# meaningful fraction of seeds (measured, `measure-generation`, PR #317
# cycle 1). `density_affinity` (below) is the soft, never-failing
# replacement: the distribution override ranks eligible candidates by it
# rather than restricting eligibility outright. None of the four carries
# a form-class tag either: two different institution kinds sharing one
# block (each free to land anywhere a `weight = 0` override reaches)
# must never trip AC1's own coherence row, which is about dwelling form
# class, not institution kind.
#
# `hospital`'s own `min_interior_*_cells` was 10x10 until PR #317 cycle
# 2: a real seed (`707006151588701530`, found by `proptest`, not by
# measurement over a sequential range) had zero institutional envelopes
# clearing 10x10 at all, so a required, always-`weight = 0` institution
# had nowhere it could ever be placed -- the same class of bug the
# earlier industrial/institutional min-interior reductions fixed.
# Lowered to 8x8, matching `council`'s own figure.

[[building_type]]
id = 35
key = "council"
tags = ["municipal_service", "council"]
land_uses = ["institutional"]
density_min = 0
density_max = 100
min_interior_width_cells = 8
min_interior_depth_cells = 8
weight = 0
prefers_site = ["arterial"]
density_affinity = 1
professions = ["clerk", "administrator", "councillor"]

