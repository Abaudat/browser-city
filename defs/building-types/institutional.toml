# Story 3.4 (FR116). `council`/`hospital`/`welfare_office`/`shelter` all
# carry `weight = 0` (see `industrial.toml`'s own comment on `depot`):
# each is placed exclusively by its own distribution row
# (defs/rules/generation.toml), never by the ordinary weighted fill.
# `public_hall` is the institutional-land filler every other
# institutional envelope resolves to, so "every envelope has exactly one
# type" holds without a special-cased fallback.
#
# Siting bands stand in for Derek's richer intent (arterial frontage,
# corner-ness, "toward the density peak" for council/hospital, "not at
# the peak" for welfare_office/shelter) -- `sim::generation::
# GenerationConfig`'s own building-type eligibility today reads only
# land use and density (Tim's schema); see the PR description for this
# simplification. None of the four restricts its own density band: `land_
# use::assign_institutional`'s own placement never guarantees an
# institutional pocket reaches any particular density band for every
# seed (pockets are sited for spacing, not for density), so pairing a
# density restriction with a `weight = 0`, distribution-only type made a
# structurally-unplaceable seed a real generation failure for a
# meaningful fraction of seeds (measured, `measure-generation`) --
# exactly the kind of "never a silently missing hospital" case AC2
# exists to prevent, but a defs-content mistake causing it, not a real
# land shortage. Open across the whole density range until a later story
# adds a real peak-affinity signal; none of the four carries a form-class
# tag either, for the same reason `commercial.toml`/`industrial.toml`
# don't: two different institution kinds sharing one block (each free to
# land anywhere a `weight = 0` override reaches) must never trip AC1's
# own coherence row, which is about dwelling form class, not institution
# kind.

[[building_type]]
id = 12
key = "council"
tags = ["municipal_service", "council"]
land_uses = ["institutional"]
density_min = 0
density_max = 100
min_interior_width_cells = 8
min_interior_depth_cells = 8
weight = 0
professions = [
  { profession = "council_clerk", headcount = 2 },
  { profession = "council_administrator", headcount = 1 },
  { profession = "councillor", headcount = 3 },
]

