# Story 3.4 (FR116). `council`/`hospital`/`welfare_office`/`shelter` all
# carry `weight = 0` (see `industrial.toml`'s own comment on `depot`):
# each is placed exclusively by its own distribution row
# (defs/rules/generation.toml), never by the ordinary weighted fill.
# `public_hall` is the institutional-land filler every other
# institutional envelope resolves to, so "every envelope has exactly one
# type" holds without a special-cased fallback.
#
# Siting bands stand in for Derek's richer intent (arterial frontage,
# corner-ness) -- `sim::generation::GenerationConfig`'s own building-type
# eligibility today reads only land use and density (Tim's schema); see
# the PR description for this simplification.

[[building_type]]
id = 12
key = "council"
tags = ["municipal_service", "council", "form_mid"]
land_uses = ["institutional"]
density_min = 50
density_max = 100
min_interior_width_cells = 8
min_interior_depth_cells = 8
weight = 0
professions = [
  { profession = "council_clerk", headcount = 2 },
  { profession = "council_administrator", headcount = 1 },
  { profession = "councillor", headcount = 3 },
]

