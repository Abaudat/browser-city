[[object]]
id = 1
key = "trash_bin"
name = "Trash Bin"
layer = "furniture"
# Story 2.13: the street's own bin (a pier bin belongs on a pier, not a
# shopping street -- Artie's direction) -- 16x32px, the extra 16px
# upward overhang like every other tall prop.
sprite = { sheet = "ModernTileset/modernexteriors-win/Modern_Exteriors_16x16/ME_Theme_Sorter_16x16/3_City_Props_Singles_16x16/ME_Singles_City_Props_16x16_Small_Closed_Trash_Can.png", x = 0, y = 0, w = 16, h = 32 }
width = 1
height = 1
# A sub-tile collider (FR128): the bin's own body, not its whole cell --
# half a cell wide and tall, centred in the cell. Sub-cells relative to
# the footprint's own north-west sub-cell origin (its top-left, matching
# the sprite's own pixel space -- not the same corner as the placed
# anchor cell, which is the footprint's south-west corner; the two
# coincide here because this object is one cell tall),
# COLLIDER_SUBCELLS_PER_CELL (16) per cell.
collider = { x0 = 4, y0 = 4, x1 = 12, y1 = 12 }
# FR148: where a player must stand to interact with the bin -- the whole
# cell plus a quarter-cell skirt on every side, so you can use it from any
# direction without standing exactly on its own collider.
interact_at = { x0 = -4, y0 = -4, x1 = 20, y1 = 20 }
# Story 2.10 (FR111): the rule engine's own vocabulary -- `defs/tags/
# city.toml`'s declared set, never a literal key past `tools/defs-build`.
# Story 2.9 (AC1): `fixture` is this object's own role tag.
tags = ["waste", "fixture"]

[[object]]
id = 2
key = "park_bench"
name = "Park Bench"
layer = "furniture"
sprite = { sheet = "ModernTileset/modernexteriors-win/Modern_Exteriors_16x16/ME_Theme_Sorter_16x16/13_School_Singles_16x16/ME_Singles_School_16x16_Bench_1.png", x = 0, y = 0, w = 32, h = 16 }
width = 2
height = 1
# Story 2.4 (FR128): a bench blocks -- the whole two-cell seat/back
# depth, leaving the front lip free to approach from.
collider = { x0 = 0, y0 = 0, x1 = 32, y1 = 12 }
tags = ["seating", "fixture"]

[[object]]
id = 3
key = "shop_counter"
name = "Shop Counter"
layer = "furniture"
sprite = { sheet = "ModernTileset/modernexteriors-win/Modern_Exteriors_16x16/ME_Theme_Sorter_16x16/21_Beach_Singles_16x16/21_Beach_16x16_Bamboo_Bar_Counter_1.png", x = 0, y = 0, w = 48, h = 64 }
width = 3
# Story 2.3 (AC3): the counter's whole footprint blocks, whatever its own
# width -- `full_cell_blocker`'s own worked case. FR148's reach is the
# customer side of it: the full-width row immediately south, outside the
# footprint entirely.
archetype = "full_cell_blocker"
interact_at = { x0 = 0, y0 = 16, x1 = 48, y1 = 32 }
tags = ["counter", "fixture"]

[[object]]
id = 4
key = "lamppost"
name = "Street Lamp"
layer = "objects"
# Story 2.13: this sprite already named the real street lamp -- the test
# street itself was the one drawing the wrong art (a picnic table borrowed
# over this def's own pole collider). The street now draws this rect
# instead of borrowing another prop's asset (Artie's direction).
sprite = { sheet = "ModernTileset/modernexteriors-win/Modern_Exteriors_16x16/ME_Theme_Sorter_16x16/3_City_Props_Singles_16x16/ME_Singles_City_Props_16x16_Street_Lamp_5.png", x = 0, y = 0, w = 16, h = 64 }
width = 1
# Story 2.3 (AC3): the story 1.8 worked example, now the `pole`
# archetype's own defining case -- a small base collider near the bottom
# of the cell, so a player passes through the rest of the cell freely.
archetype = "pole"
tags = ["lighting", "fixture"]

[[object]]
id = 5
key = "shop_window"
name = "Shop Window"
layer = "walls"
# Story 2.13: the shopfront window is one three-cell glazing unit, not a
# one-cell balcony window -- both shops on the test street place it
# three wide already (Artie's direction). 48x32px, exactly three tiles
# wide.
sprite = { sheet = "ModernTileset/modernexteriors-win/Modern_Exteriors_16x16/ME_Theme_Sorter_16x16/16_Office_Singles_16x16/ME_Singles_Office_16x16_Window_1_Middle_Modular.png", x = 0, y = 0, w = 48, h = 32 }
width = 3
# Story 1.7 (FR121): a window wall tile -- solid like any other wall cell
# (the whole cell), but drawn semi-transparently (`render.window_alpha`)
# and retracted like any other front wall.
window = true
# Story 2.3 (AC3): the whole cell blocks -- `full_cell_blocker`.
archetype = "full_cell_blocker"
# Story 2.9 (AC1): a window is a wall variant -- solid, part of the
# building envelope -- so its role tag is `wall`, not `fixture`.
tags = ["shopfront", "wall", "wall_run"]

[[object]]
id = 6
key = "wall_segment"
name = "Wall Segment"
layer = "walls"
# Story 2.13: a generic city wall cell, not a garden grass wall (Artie's
# direction) -- the same flush swatch (`WALL_TILE_V_FRAME`) the bridge's
# own four parapet cells already drew from the interior Room Builder
# sheet at the harness level.
sprite = { sheet = "ModernTileset/moderninteriors-win/1_Interiors/16x16/Room_Builder_subfiles/Room_Builder_Walls_16x16.png", x = 0, y = 528, w = 16, h = 16 }
width = 1
# One plain, solid wall cell -- the generic segment a wall run (a
# building facade, a bridge railing) is laid from, one cell at a time.
# The whole cell blocks (story 2.3's `full_cell_blocker` archetype). A
# doorway is the absence of a segment, never an object of its own (FR118:
# a door is an ordinary walkable cell).
archetype = "full_cell_blocker"
# Story 2.9 (AC1): `wall` is both a plain tag and this object's own role
# tag (tag 6 carries the role table, `defs/tags/city.toml`). `wall_run`
# is the wall-closure primitive's own vocabulary (AC3).
tags = ["wall", "wall_run"]

[[object]]
id = 7
key = "bridge_deck"
name = "Bridge Deck"
layer = "objects"
# Story 2.13 (Tim's direction): no `repeat` axis on `sprite` -- a surface
# wider than its art is a one-cell object placed once per cell, the same
# way `wall_segment`'s own parapet run already is. The deck is one real
# 16x16 pavement tile (the same city sidewalk tile the street below it is
# paved with); the test street places `BRIDGE_DECK_WIDTH` (4) of these,
# one per deck column, rather than this def declaring a 4-wide footprint.
sprite = { sheet = "ModernTileset/modernexteriors-win/Modern_Exteriors_16x16/ME_Theme_Sorter_16x16/2_City_Terrains_Singles_16x16/ME_Singles_City_Terrains_16x16_Sidewalk_1_1.png", x = 0, y = 0, w = 16, h = 16 }
width = 1
# The walkable span of a footbridge: no collider at all (FR128, story
# 2.3's `underfoot_flat` archetype), so an entity on the deck's own floor
# walks the whole span and an entity on the floor below passes under it
# unobstructed -- the deck occupies the same (x, y) as the street beneath
# it and never contributes collision to it (FR117). Story 2.4 (FR128):
# explicitly walkable, not merely absent a collider -- `underfoot`.
archetype = "underfoot_flat"
tags = ["bridge", "underfoot", "fixture"]

[[object]]
id = 8
key = "foot_stairs"
name = "Foot Stairs"
layer = "objects"
# Story 2.13: concrete station steps, not garden steps -- a concrete
# footbridge does not land on a garden stair (Artie's direction).
# 16x48px, one cell wide.
sprite = { sheet = "ModernTileset/modernexteriors-win/Modern_Exteriors_16x16/ME_Theme_Sorter_16x16/20_Subway_and_Train_Station_Singles_16x16/ME_Singles_Subway_and_Train_Station_16x16_Stairs_Small_2.png", x = 0, y = 0, w = 16, h = 48 }
width = 1
# A flight of steps between two floors: a physical, walkable prop, never
# a teleport tile. Which floors it joins is a `floor_transition` row
# anchored on its cell (FR117), never a field here. Story 2.4 (FR128):
# explicitly walkable -- `underfoot` (story 2.3's `underfoot_flat`
# archetype).
archetype = "underfoot_flat"
tags = ["stairs", "underfoot", "fixture"]
