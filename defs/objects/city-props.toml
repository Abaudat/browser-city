sprite = { sheet = "ModernTileset/modernexteriors-win/Modern_Exteriors_16x16/ME_Theme_Sorter_16x16/22_Post_Office_Singles_16x16/22_Post_Office_16x16_Black_Mailbox_1_Front.png", x = 0, y = 0, w = 16, h = 32 }
width = 1
height = 1
collider = { x0 = 4, y0 = 7, x1 = 14, y1 = 15 }
interact_at = { x0 = -4, y0 = -4, x1 = 20, y1 = 20 }
tags = ["registry_post", "fixture"]

# The well under the street stairwell's near railing: the east post's foot and
# the dark floor seen between the balusters. Flat, anchored on the railing's
