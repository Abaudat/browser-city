# the stairwell's rows add up to the whole `Stairs_Complete_2` sheet.
[[object]]
id = 19
key = "stairwell_well"
name = "Stairwell Well"
layer = "ground_objects"
sprite = { sheet = "ModernTileset/modernexteriors-win/Modern_Exteriors_16x16/ME_Theme_Sorter_16x16/20_Subway_and_Train_Station_Singles_16x16/ME_Singles_Subway_and_Train_Station_16x16_Stairs_Complete_2.png", x = 0, y = 48, w = 48, h = 16 }
width = 3
archetype = "underfoot_flat"
tags = ["stairs", "underfoot", "fixture"]
