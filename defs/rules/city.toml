# Story 2.10 (FR111/FR112): the generic rule engine's own data, evaluated
# by `sim::rules::evaluate` -- never a bespoke branch in that engine.
# Placeholder content against today's real tags (`defs/tags/city.toml`):
# Epic 3's generator does not exist yet, so nothing here fires against a
# real placement today; 2.12 lifts rows like these into worked examples
# once it does. One row per kind, as Tim's direction asks.

# Placement: a street lamp only ever stands at street level.
[[placement]]
id = 1
key = "lighting_ground_floor_only"
subject = "lighting"
floor_min = 0
floor_max = 0

# Distribution: roughly one waste bin per three seats, evenly spread (no
# two bins closer than four cells, and no seat further than twelve cells
# from its nearest bin).
[[distribution]]
id = 2
key = "waste_per_three_seating"
subject = "waste"
per = "seating"
ratio = 3
tolerance_percent = 50
min_spacing = 4
max_distance = 12
# Coherence: a shop counter never shares a room with a stairwell.
[[coherence]]
id = 3
key = "no_counter_in_a_stairwell"
subject = "counter"
within = "stairs"
mode = "forbid"

# Requirement: an area holding seating has a waste bin -- the prop-placement
# pass's own row (a block's street benches, each with its bin in the block);
# the interior-layout pass never emits seating, so it cannot fire there.
[[requirement]]
id = 5
key = "walled_room_has_waste_bin"
container = "seating"
requires = "waste"
min = 1
