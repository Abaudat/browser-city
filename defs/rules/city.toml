# Story 2.10 (FR111/FR112): the generic rule engine's own data, evaluated
# by `sim::rules::evaluate` -- never a bespoke branch in that engine.
# Placeholder content against today's real tags (`defs/tags/city.toml`):
# Epic 3's generator does not exist yet, so nothing here fires against a
# real placement today; 2.12 lifts rows like these into worked examples
# once it does. One row per kind, as Tim's direction asks.

# Placement: a street lamp only ever stands at street level.
[[placement]]
id = 1
key = "lighting_ground_floor_only"
subject = "lighting"
floor_min = 0
floor_max = 0

# Distribution: roughly one waste bin per three seats, evenly spread (no
# two bins closer than four cells, and no seat further than twelve cells
# from its nearest bin).
[[distribution]]
id = 2
key = "waste_per_three_seating"
subject = "waste"
per = "seating"
ratio = 3
tolerance_percent = 50
min_spacing = 4
max_distance = 12
# Coherence: a shop counter never shares a room with a stairwell.
[[coherence]]
id = 3
key = "no_counter_in_a_stairwell"
subject = "counter"
within = "stairs"
mode = "forbid"

# Adjacency: a counter must have walkable floor on at least one side --
# a till nobody can stand at is a prop, not a counter (Derek's direction:
# every fixture a citizen acts at has a cell beside it to act from). The
# key is permanent; it named the placeholder this row replaced.
[[adjacency]]
id = 4
key = "counter_faces_a_shopfront"
a = "counter"
relation = "require"
rotate = true
alternatives = [
  [
    { direction = "north", tag = "floor" },
  ],
]

# Requirement: a room holding seating has a waste bin -- still a
# placeholder for the prop-placement pass (waste bins and seating are its
# vocabulary), kept on `seating` so it can never fire on anything the
# interior-layout pass emits.
[[requirement]]
id = 5
key = "walled_room_has_waste_bin"
container = "seating"
requires = "waste"
min = 1
