# Story 3.4 (FR112/FR116): the building-type pass's own committed rule
# rows, evaluated by the one `sim::rules::evaluate` -- the generator
# (`sim::generation::building_types::run`) and the harness
# (`sim::generation::District::check_rules`) read this same table, never
# a second copy.
#
# Coherence (AC1, "no skyscraper among villas"): the two form-class
# extremes never share a block. `plots.density` is uniform per block
# (`sim::generation::block_land_use`'s own precedent), and the committed
# form-class density bands (`defs/building-types/*.toml`) only overlap at
# their edges, so this fires only on a genuine authoring mistake -- a
# type whose band spans both extremes -- never on ordinary generated
# output.
[[coherence]]
id = 20
key = "no_high_rise_within_a_low_rise_block"
subject = "form_high"
within = "form_low"
mode = "forbid"

# Distribution (presence and even spread): each named institution is a
# distribution row over the `dwelling` tag, never a count field on the
# building type itself. The generator reads each row's ratio, tolerance
# and spacing through `sim::rules::distribution_target`, the same
# formula `sim::rules::evaluate` judges it by.
#
# `scope = "site"` (the default) judges the whole district: one depot,
# one council building and one hospital per `ratio` dwellings, so a
# district that grows past the next multiple is owed another.
# `scope = "catchment"` judges each catchment on its own
# (`generation.catchment_extent_cells`): every catchment owes its own
# share, and ground added elsewhere never moves its verdict.
#
# A catchment row may give its number as a two-ended pair read against one
# neighbourhood parameter (`reads = "affluence"`, `ratio_at_min` where the
# parameter is at its minimum, `ratio_at_max` at its maximum), interpolated
# on the catchment's own mean over its `per` cells. `tolerance_percent`
# wide enough that a row's lower bound is 0 at the largest target a
# catchment can owe lets a catchment whose land cannot hold it stay short
# without failing the district.
#
# `max_distance` is past the site's diagonal on every row: no coverage
# ceiling on a municipal row, the walk to one is content.
[[distribution]]
id = 21
key = "depot_present"
subject = "depot"
per = "dwelling"
ratio = 350
tolerance_percent = 25
min_spacing = 40
max_distance = 2000

[[distribution]]
id = 22
key = "council_present"
subject = "council"
per = "dwelling"
ratio = 350
tolerance_percent = 25
min_spacing = 40
max_distance = 2000

[[distribution]]
id = 23
key = "hospital_present"
subject = "hospital"
per = "dwelling"
ratio = 350
tolerance_percent = 25
min_spacing = 40
max_distance = 2000

# Welfare offices and shelters sit where land is cheap, at real number, and
# thin as a catchment's affluence rises. They share the scarce
# institutional-or-commercial land, so their tolerance is wider than the
# rows above. Retune over a million seeds: no rule failure, pooled placed
# means within 10% of the previous figures (welfare 3.3, shelter 5.2, cafe
# 11.2 per district).
[[distribution]]
id = 24
key = "welfare_office_present"
subject = "welfare_office"
per = "dwelling"
reads = "affluence"
ratio_at_min = 70
ratio_at_max = 150
tolerance_percent = 85
min_spacing = 24
max_distance = 2000
scope = "catchment"

[[distribution]]
id = 25
key = "shelter_present"
subject = "shelter"
per = "dwelling"
reads = "affluence"
ratio_at_min = 45
ratio_at_max = 130
tolerance_percent = 85
min_spacing = 20
max_distance = 2000
scope = "catchment"

# Cafes are the barista's own workplace (FR14): a city with none reads as
# broken, so every catchment owes its share (`weight = 0` on the type in
# `defs/building-types/commercial.toml` plus this row), thickening as a
# catchment's affluence rises. A cafe is itself a shop, so the row is per
# shop and a cafe replaces only a shop.
[[distribution]]
id = 26
key = "cafe_present"
subject = "cafe"
per = "shop"
reads = "affluence"
ratio_at_min = 20
ratio_at_max = 7
tolerance_percent = 80
min_spacing = 12
max_distance = 2000
scope = "catchment"
