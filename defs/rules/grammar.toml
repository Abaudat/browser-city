# Story 2.9 (AC2/AC3/AC4, FR119): the room/building grammar's own
# primitives -- ordinary `[[adjacency]]` rows over the role tags
# `defs/tags/roles.toml` (and `wall`, `defs/tags/city.toml`) declare,
# evaluated by the same `sim::rules::evaluate` every other rule kind
# uses (Tim's direction: this is never a second validator). Ids continue
# after `defs/rules/city.toml`'s own five (permanent, append-only).
#
# Scope (Crew's decision, named here on purpose rather than faked):
# a kerb/verge edge variant between road and ground, a wall T-junction
# or four-way crossing, a threshold's own wall jamb, and "no void cell
# inside a composed area" are all left out of this row set -- the first
# needs art this story's tile budget does not add (Artie's own
# direction: "leave the construction out... name the missing piece");
# the wall-junction and jamb shapes need either a counting primitive or
# several more Forbid rows enumerating every *absence* pattern, which
# this engine's Forbid form (a single `present: true` term per
# alternative, so a violation's pair stays unambiguous) cannot state
# directly; "no void" needs a primitive that asks "does this cell carry
# any tag at all", which no rule kind here asks. Named for Derek/Tim to
# pick up as a later row, not a code change.

# Artie's direction #4, first bullet: a building faces pavement, never
# raw ground -- road and floor are never in direct contact either
# (pavement, or a formed doorway, always sits between).
[[adjacency]]
id = 6
key = "road_never_touches_floor"
a = "road"
b = "floor"
relation = "forbid"

[[adjacency]]
id = 7
key = "road_never_touches_wall"
a = "road"
b = "wall"
relation = "forbid"

# Artie's direction #4, fourth and fifth bullets: a floor cell is only
# ever legal next to another floor, a wall or a threshold -- touching
# any bare ground-level surface directly means the room is not sealed.
# An interior floor cell (surrounded by more floor) never triggers
# this; only a cell at an unsealed boundary does.
[[adjacency]]
id = 8
key = "floor_never_touches_bare_ground"
a = "floor"
b = "ground"
relation = "forbid"

[[adjacency]]
id = 9
key = "floor_never_touches_pavement_directly"
a = "floor"
b = "pavement"
relation = "forbid"

[[adjacency]]
id = 10
key = "floor_never_touches_road_directly"
a = "floor"
b = "road"
relation = "forbid"

# Artie's direction #5: a doorway is formed, not drawn -- "wall on two
# opposite sides, either orientation" with floor on one remaining side
# and pavement/floor on the other. One authored alternative, `rotate =
# true` lowers it to the four orientations (Tim's direction) --
# `inv_grammar_rotate_invariant` (`server/sim/tests/invariants.rs`)
# pins that a 90-degree turn of the whole site never changes this row's
# verdict.
[[adjacency]]
id = 11
key = "threshold_between_floor_and_pavement_flanked_by_walls"
a = "threshold"
relation = "require"
rotate = true
alternatives = [
  [
    { direction = "north", tag = "wall" },
    { direction = "south", tag = "wall" },
    { direction = "east", tag = "floor" },
    { direction = "west", tag = "pavement" },
  ],
]

# Artie's direction #4, third bullet ("no free-standing wall stubs") and
# #5 ("nobody places a corner, the grammar picks it"): every wall cell
# is part of a straight run or a corner -- two same-axis wall neighbours
# (a straight run) or two perpendicular ones (a corner). `rotate = true`
# lowers the straight-run alternative to its two orientations and the
# corner alternative to its four (deduplicated after canonicalisation,
# `tools/defs-build`'s own `canonicalise_alternatives`).
[[adjacency]]
id = 12
key = "wall_is_part_of_a_straight_run_or_a_corner"
a = "wall"
relation = "require"
rotate = true
alternatives = [
  [
    { direction = "north", tag = "wall" },
    { direction = "south", tag = "wall" },
  ],
  [
    { direction = "north", tag = "wall" },
    { direction = "east", tag = "wall" },
  ],
]
